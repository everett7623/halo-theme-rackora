<include src="layout.html">
  <template name="head">
    <title th:text="|页面不存在 - ${site.title}|">页面不存在</title>
  </template>

  <section class="error-page">
    <p class="error-code">404</p>
    <h1>页面不存在</h1>
    <p>这个地址可能已经变更，或者内容已被合并。</p>
    <div class="error-actions">
      <a class="button button--primary" th:href="@{/}">返回首页</a>
      <a class="button" th:href="@{${site.routes.archivesUri}}">浏览归档</a>
    </div>
  </section>
</include>
