<include src="layout.html">
  <template name="head">
    <title th:text="|${post.spec.title} - ${site.title}|">文章标题</title>
    <include
      src="seo-head.html"
      path="post.status.permalink"
      title="post.spec.title"
      description="post.status.excerpt"
      image="post.spec.cover ?: site.logo"
      type="article"
    ></include>
    <meta property="article:published_time" th:content="${post.spec.publishTime}" />
    <meta
      property="article:modified_time"
      th:content="${post.status.lastModifyTime != null and post.status.lastModifyTime.isAfter(post.spec.publishTime) ? post.status.lastModifyTime : post.spec.publishTime}"
    />
    <th:block
      th:with="siteBase = ${#strings.endsWith(site.url, '/') ? #strings.substring(site.url, 0, #strings.length(site.url) - 1) : site.url},logoRaw = ${theme.config.seo.organization_logo ?: (#strings.isEmpty(site.logo) ? #theme.assets('/images/rackora-mark.svg') : site.logo)},logoAbs = ${(#strings.startsWith(logoRaw, 'https://') or #strings.startsWith(logoRaw, 'http://')) ? logoRaw : siteBase + (#strings.startsWith(logoRaw, '/') ? logoRaw : '/' + logoRaw)},imageRaw = ${not #strings.isEmpty(post.spec.cover) ? post.spec.cover : logoRaw},imageAbs = ${(#strings.startsWith(imageRaw, 'https://') or #strings.startsWith(imageRaw, 'http://')) ? imageRaw : siteBase + (#strings.startsWith(imageRaw, '/') ? imageRaw : '/' + imageRaw)},orgId = ${siteBase + '#organization'}"
    >
      <script type="application/ld+json" th:inline="javascript">
        {
          "@context": "https://schema.org",
          "@type": "BlogPosting",
          "@id": /*[[${siteBase + post.status.permalink}]]*/ "https://example.com/post",
          "url": /*[[${siteBase + post.status.permalink}]]*/ "https://example.com/post",
          "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": /*[[${siteBase + post.status.permalink}]]*/ "https://example.com/post"
          },
          "headline": /*[[${post.spec.title}]]*/ "Post title",
          "description": /*[[${post.status.excerpt ?: ''}]]*/ "",
          "inLanguage": /*[[${theme.config.basic.site_language ?: 'en-US'}]]*/ "en-US",
          "datePublished": /*[[${post.spec.publishTime}]]*/ "2026-01-01T00:00:00Z",
          "dateModified": /*[[${post.status.lastModifyTime != null and post.status.lastModifyTime.isAfter(post.spec.publishTime) ? post.status.lastModifyTime : post.spec.publishTime}]]*/ "2026-01-01T00:00:00Z",
          "author": {
            "@type": "Person",
            "name": /*[[${post.owner.displayName}]]*/ "Author",
            "url": /*[[${siteBase + post.owner.permalink}]]*/ "https://example.com/authors/author"
          },
          "publisher": {
            "@type": "Organization",
            "@id": /*[[${orgId}]]*/ "https://example.com#organization",
            "name": /*[[${theme.config.seo.organization_name ?: site.title}]]*/ "Site",
            "url": /*[[${siteBase + '/'}]]*/ "https://example.com/",
            "logo": {
              "@type": "ImageObject",
              "url": /*[[${logoAbs}]]*/ "https://example.com/logo.svg"
            }
          },
          "image": /*[[${imageAbs}]]*/ "https://example.com/logo.svg"
        }
      </script>
    </th:block>
    <script type="module" src="./js/post.ts"></script>
  </template>

  <div class="reading-progress" aria-hidden="true"><span data-reading-progress></span></div>
  <div
    class="article-layout"
    th:with="showPostToc = ${theme.config.post?.show_post_toc != null ? theme.config.post.show_post_toc : (theme.config.content?.show_post_toc == null or theme.config.content.show_post_toc)},showPostLatest = ${theme.config.post?.show_post_latest != null ? theme.config.post.show_post_latest : (theme.config.content?.show_post_latest == null or theme.config.content.show_post_latest)},showPostComments = ${theme.config.post?.show_post_comments != null ? theme.config.post.show_post_comments : (theme.config.content?.show_post_comments == true)},showPostSidebar = ${(theme.config.post?.show_post_sidebar != null ? theme.config.post.show_post_sidebar : (theme.config.content?.show_post_sidebar == null or theme.config.content.show_post_sidebar)) and (showPostToc or showPostLatest or showPostComments)},showPostLicense = ${theme.config.post?.show_post_license != null ? theme.config.post.show_post_license : (theme.config.content?.show_post_license == null or theme.config.content.show_post_license)},showShareLink = ${theme.config.post?.show_share_link == null or theme.config.post.show_share_link},showShareBar = ${theme.config.post?.show_share_bar == null or theme.config.post.show_share_bar},shareTargets = ${theme.config.post?.share_targets},shareX = ${shareTargets == null or #lists.isEmpty(shareTargets) or #lists.contains(shareTargets, 'x') or #lists.contains(shareTargets, 'twitter')},shareFacebook = ${shareTargets == null or #lists.isEmpty(shareTargets) or #lists.contains(shareTargets, 'facebook')},shareLinkedin = ${shareTargets == null or #lists.isEmpty(shareTargets) or #lists.contains(shareTargets, 'linkedin')},shareReddit = ${shareTargets == null or #lists.isEmpty(shareTargets) or #lists.contains(shareTargets, 'reddit')},shareTelegram = ${shareTargets == null or #lists.isEmpty(shareTargets) or #lists.contains(shareTargets, 'telegram')},shareWhatsapp = ${shareTargets == null or #lists.isEmpty(shareTargets) or #lists.contains(shareTargets, 'whatsapp')},shareWeibo = ${shareTargets == null or #lists.isEmpty(shareTargets) or #lists.contains(shareTargets, 'weibo')},shareEmail = ${shareTargets == null or #lists.isEmpty(shareTargets) or #lists.contains(shareTargets, 'email')},showImageLightbox = ${theme.config.post?.show_image_lightbox == null or theme.config.post.show_image_lightbox},showRelatedPosts = ${theme.config.post?.show_related_posts == null or theme.config.post.show_related_posts},showSeries = ${theme.config.post?.show_series == null or theme.config.post.show_series},seriesName = ${#annotations.get(post, 'rackora_series')},postSidebarCount = ${theme.config.post?.post_sidebar_count ?: theme.config.content?.post_sidebar_count ?: 5},postCommentCount = ${theme.config.post?.post_comment_count ?: theme.config.content?.post_comment_count ?: 3},relatedPostCount = ${theme.config.post?.related_post_count ?: 4},seriesPostCount = ${theme.config.post?.series_post_count ?: 6},imageMode = ${theme.config.appearance.image_mode ?: theme.config.content?.image_mode ?: 'none'},licenseName = ${theme.config.post?.license_name ?: theme.config.content?.license_name ?: 'CC BY-NC-SA 4.0'},licenseUrl = ${theme.config.post?.license_url ?: theme.config.content?.license_url ?: (licenseName == 'CC BY-NC-SA 4.0' ? 'https://creativecommons.org/licenses/by-nc-sa/4.0/' : null)}"
    th:classappend="${showPostSidebar} ? '' : ' article-layout--single'"
  >
    <article
      class="article"
      data-article
      itemscope
      itemtype="https://schema.org/BlogPosting"
      th:attr="itemid=${post.status.permalink}"
    >
      <link itemprop="mainEntityOfPage" th:href="@{${post.status.permalink}}" />
      <meta itemprop="inLanguage" th:content="${theme.config.basic.site_language ?: 'en-US'}" />
      <span
        hidden
        itemprop="publisher"
        itemscope
        itemtype="https://schema.org/Organization"
        th:attr="itemid=${site.url + '#organization'}"
      >
        <meta itemprop="name" th:content="${theme.config.seo.organization_name ?: site.title}" />
        <link itemprop="url" th:href="@{${site.url}}" />
        <span itemprop="logo" itemscope itemtype="https://schema.org/ImageObject">
          <link
            itemprop="url"
            th:href="@{${theme.config.seo.organization_logo ?: (#strings.isEmpty(site.logo) ? #theme.assets('/images/rackora-mark.svg') : site.logo)}}"
          />
        </span>
      </span>
      <header class="article-header">
        <nav
          class="breadcrumbs"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '面包屑' : 'Breadcrumb'}"
          itemscope
          itemtype="https://schema.org/BreadcrumbList"
        >
          <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <a itemprop="item" th:href="@{/}"
              ><span
                itemprop="name"
                th:text="${theme.config.basic.ui_language == 'zh-CN' ? '首页' : 'Home'}"
                >Home</span
              ></a
            >
            <meta itemprop="position" content="1" />
          </span>
          <span aria-hidden="true">/</span>
          <span
            th:if="${not #lists.isEmpty(post.categories)}"
            itemprop="itemListElement"
            itemscope
            itemtype="https://schema.org/ListItem"
          >
            <a itemprop="item" th:href="@{${post.categories[0].status.permalink}}">
              <span itemprop="name" th:text="${post.categories[0].spec.displayName}">栏目</span>
            </a>
            <meta itemprop="position" content="2" />
          </span>
          <span th:if="${not #lists.isEmpty(post.categories)}" aria-hidden="true">/</span>
          <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <span itemprop="name" aria-current="page" th:text="${post.spec.title}">文章</span>
            <meta itemprop="position" th:content="${#lists.isEmpty(post.categories) ? '2' : '3'}" />
          </span>
        </nav>
        <h1 class="article-title" itemprop="headline" th:text="${post.spec.title}">文章标题</h1>
        <p
          class="article-deck"
          itemprop="description"
          th:if="${not #strings.isEmpty(post.status.excerpt)}"
          th:text="${post.status.excerpt}"
        ></p>
        <div class="article-meta">
          <span itemprop="author" itemscope itemtype="https://schema.org/Person">
            <a
              class="article-author"
              itemprop="url"
              th:href="@{${post.owner.permalink}}"
              rel="author"
              ><span itemprop="name" th:text="${post.owner.displayName}">Author</span></a
            >
          </span>
          <time
            itemprop="datePublished"
            th:datetime="${post.spec.publishTime}"
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '发布于 ' + #temporals.format(post.spec.publishTime, 'yyyy-MM-dd') : 'Published ' + #temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"
          ></time>
          <time
            itemprop="dateModified"
            th:if="${post.status.lastModifyTime != null}"
            th:datetime="${post.status.lastModifyTime}"
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '更新于 ' + #temporals.format(post.status.lastModifyTime, 'yyyy-MM-dd') : 'Updated ' + #temporals.format(post.status.lastModifyTime, 'yyyy-MM-dd')}"
          ></time>
          <span
            th:if="${not #strings.isEmpty(#annotations.get(post, 'rackora_verified_at'))}"
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '核验于 ' + #annotations.get(post, 'rackora_verified_at') : 'Verified ' + #annotations.get(post, 'rackora_verified_at')}"
          ></span>
          <span
            data-reading-time
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '计算阅读时间' : 'Calculating reading time'}"
            >Calculating reading time</span
          >
          <span
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? post.stats.visit + ' 阅读' : post.stats.visit + ' views'}"
            >0 views</span
          >
        </div>
      </header>

      <th:block
        th:with="relation = ${#annotations.getOrDefault(post, 'rackora_affiliate_relation', 'none')}"
      >
        <aside
          class="article-disclosure"
          th:if="${relation == 'affiliate' or relation == 'sponsored_review' or relation == 'self_purchased'}"
          th:switch="${relation}"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '内容关系披露' : 'Content relationship disclosure'}"
        >
          <p
            th:case="'affiliate'"
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '本文包含 Affiliate / Referral 推广链接，本站可能获得佣金，不影响用户价格与编辑判断。' : 'This post contains affiliate or referral links. The site may earn a commission without affecting your price or our editorial judgment.'}"
          ></p>
          <p
            th:case="'sponsored_review'"
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '本文包含商家提供的送测资源；测试方法、结果与限制仍由本站独立记录。' : 'A vendor supplied resources for this review; the methods, results, and limitations remain independently documented.'}"
          ></p>
          <p
            th:case="'self_purchased'"
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '本文涉及的产品或服务由本站自购测试。' : 'The product or service covered in this post was independently purchased for testing.'}"
          ></p>
        </aside>
      </th:block>

      <figure
        class="article-cover"
        th:if="${(imageMode == 'article' or imageMode == 'all') and not #strings.isEmpty(post.spec.cover)}"
      >
        <img
          th:src="${post.spec.cover}"
          th:alt="${post.spec.title}"
          itemprop="image"
          decoding="async"
          fetchpriority="high"
          width="1280"
          height="720"
        />
      </figure>

      <include src="ad-slot.html" position="post_before"></include>

      <div
        id="article-content"
        class="article-content"
        itemprop="articleBody"
        th:utext="${post.content.content}"
        data-article-content
        th:attr="data-image-lightbox=${showImageLightbox}"
      ></div>

      <include src="ad-slot.html" position="post_after"></include>

      <footer class="article-footer">
        <div class="article-footer__meta">
          <div
            class="article-tags"
            th:if="${not #lists.isEmpty(post.tags)}"
            th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '文章标签' : 'Post tags'}"
          >
            <a
              th:each="tag : ${post.tags}"
              th:href="@{${tag.status.permalink}}"
              th:text="${tag.spec.displayName}"
            ></a>
          </div>
          <include src="share-bar.html"></include>
        </div>

        <aside
          class="series-posts"
          th:if="${showSeries and not #strings.isEmpty(seriesName)}"
          th:with="seriesPosts = ${postFinder.listAll()}"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '文章系列' : 'Series'},data-series-limit=${seriesPostCount}"
          data-series-list
        >
          <h2>
            <span th:text="${theme.config.basic.ui_language == 'zh-CN' ? '系列' : 'Series'}"
              >Series</span
            >
            <span th:text="${seriesName}">Series</span>
          </h2>
          <ol>
            <li
              th:each="seriesPost : ${seriesPosts}"
              th:with="itemSeries = ${#annotations.get(seriesPost, 'rackora_series')},itemOrder = ${#annotations.getOrDefault(seriesPost, 'rackora_series_order', '9999')}"
              th:if="${itemSeries == seriesName}"
              th:attr="data-series-order=${itemOrder}"
              th:classappend="${seriesPost.metadata.name == post.metadata.name} ? ' is-current'"
            >
              <a
                th:href="@{${seriesPost.status.permalink}}"
                th:text="${seriesPost.spec.title}"
                th:attr="aria-current=${seriesPost.metadata.name == post.metadata.name ? 'page' : null}"
              ></a>
            </li>
          </ol>
        </aside>

        <aside
          class="related-posts"
          th:if="${showRelatedPosts and not #lists.isEmpty(post.categories)}"
          th:with="relatedPosts = ${postFinder.list({page: 1, size: relatedPostCount + 1, categoryName: post.categories[0].metadata.name, sort: {'spec.publishTime,desc'}})}"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '相关文章' : 'Related posts'}"
        >
          <h2 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '相关文章' : 'Related posts'}">
            Related posts
          </h2>
          <ol>
            <li
              th:each="relatedPost : ${relatedPosts.items}"
              th:if="${relatedPost.metadata.name != post.metadata.name}"
            >
              <a
                th:href="@{${relatedPost.status.permalink}}"
                th:text="${relatedPost.spec.title}"
              ></a>
            </li>
          </ol>
        </aside>

        <aside
          class="related-posts"
          th:if="${showRelatedPosts and #lists.isEmpty(post.categories) and not #lists.isEmpty(post.tags)}"
          th:with="relatedPosts = ${postFinder.list({page: 1, size: relatedPostCount + 1, tagName: post.tags[0].metadata.name, sort: {'spec.publishTime,desc'}})}"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '相关文章' : 'Related posts'}"
        >
          <h2 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '相关文章' : 'Related posts'}">
            Related posts
          </h2>
          <ol>
            <li
              th:each="relatedPost : ${relatedPosts.items}"
              th:if="${relatedPost.metadata.name != post.metadata.name}"
            >
              <a
                th:href="@{${relatedPost.status.permalink}}"
                th:text="${relatedPost.spec.title}"
              ></a>
            </li>
          </ol>
        </aside>

        <aside
          class="article-license"
          th:if="${showPostLicense}"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '作者与版权声明' : 'Author and copyright notice'}"
        >
          <div class="article-license__lead">
            <strong th:text="${post.spec.title}">Post title</strong>
            <a th:href="@{${post.status.permalink}}" th:text="${post.status.permalink}"></a>
          </div>
          <dl>
            <div>
              <dt th:text="${theme.config.basic.ui_language == 'zh-CN' ? '作者' : 'Author'}">
                Author
              </dt>
              <dd th:text="${post.owner.displayName}">Author</dd>
            </div>
            <div>
              <dt th:text="${theme.config.basic.ui_language == 'zh-CN' ? '发布于' : 'Published'}">
                Published
              </dt>
              <dd th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}">
                2026-01-01
              </dd>
            </div>
            <div>
              <dt th:text="${theme.config.basic.ui_language == 'zh-CN' ? '许可' : 'License'}">
                License
              </dt>
              <dd>
                <a
                  th:if="${not #strings.isEmpty(licenseUrl)}"
                  th:href="@{${licenseUrl}}"
                  th:text="${licenseName}"
                  target="_blank"
                  rel="license noopener noreferrer"
                ></a>
                <span th:if="${#strings.isEmpty(licenseUrl)}" th:text="${licenseName}"></span>
              </dd>
            </div>
          </dl>
          <span class="article-license__mark" aria-hidden="true">©</span>
        </aside>

        <nav
          class="post-navigation"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '相邻文章' : 'Adjacent posts'}"
          th:with="cursor = ${postFinder.cursor(post.metadata.name)}"
        >
          <a th:if="${cursor.hasPrevious()}" th:href="@{${cursor.previous.status.permalink}}">
            <span th:text="${theme.config.basic.ui_language == 'zh-CN' ? '上一篇' : 'Previous'}"
              >Previous</span
            >
            <strong th:text="${cursor.previous.spec.title}"></strong>
          </a>
          <a th:if="${cursor.hasNext()}" th:href="@{${cursor.next.status.permalink}}">
            <span th:text="${theme.config.basic.ui_language == 'zh-CN' ? '下一篇' : 'Next'}"
              >Next</span
            >
            <strong th:text="${cursor.next.spec.title}"></strong>
          </a>
        </nav>
      </footer>

      <section class="comments" th:if="${haloCommentEnabled}" aria-labelledby="comments-title">
        <h2
          id="comments-title"
          th:text="${theme.config.basic.ui_language == 'zh-CN' ? '评论' : 'Comments'}"
        >
          Comments
        </h2>
        <halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}" />
      </section>
    </article>

    <aside
      class="article-sidebar"
      th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '文章辅助导航' : 'Post navigation'}"
      th:if="${showPostSidebar}"
    >
      <section class="article-sidebar__section" data-toc-container th:if="${showPostToc}" hidden>
        <header class="article-sidebar__heading">
          <h2 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '本页目录' : 'On this page'}">
            On this page
          </h2>
        </header>
        <nav data-toc></nav>
      </section>

      <section
        class="article-sidebar__section"
        th:if="${showPostLatest}"
        th:with="sidebarPosts = ${postFinder.list({page: 1, size: postSidebarCount, sort: {'spec.publishTime,desc'}})}"
      >
        <header class="article-sidebar__heading">
          <h2 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '最新文章' : 'Latest posts'}">
            Latest posts
          </h2>
        </header>
        <ol class="article-sidebar__posts">
          <li th:each="sidebarPost : ${sidebarPosts.items}">
            <a th:href="@{${sidebarPost.status.permalink}}" th:text="${sidebarPost.spec.title}"></a>
          </li>
        </ol>
      </section>

      <section
        class="article-sidebar__section"
        th:if="${showPostComments}"
        th:with="sidebarComments = ${commentFinder.list({group: 'content.halo.run', version: 'v1alpha1', kind: 'Post', name: post.metadata.name}, 1, postCommentCount)}"
      >
        <header class="article-sidebar__heading">
          <h2
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '最新评论' : 'Recent comments'}"
          >
            Recent comments
          </h2>
        </header>
        <ul class="article-sidebar__comments" th:if="${not #lists.isEmpty(sidebarComments.items)}">
          <li th:each="comment : ${sidebarComments.items}">
            <strong th:text="${comment.spec.owner.displayName}">Guest</strong>
            <p
              th:text="${#strings.abbreviate(#strings.replace(comment.spec.content, '&nbsp;', ' '), 96)}"
            ></p>
          </li>
        </ul>
        <p class="article-sidebar__empty" th:if="${#lists.isEmpty(sidebarComments.items)}">
          <span
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '暂无评论' : 'No comments yet'}"
            >No comments yet</span
          >
        </p>
      </section>
    </aside>
  </div>
</include>
