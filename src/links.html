<include src="layout.html">
  <template name="head">
    <title th:text="|${linksTitle} - ${site.title}|">Links</title>
    <include
      src="seo-head.html"
      path="'/links'"
      title="linksTitle + ' - ' + site.title"
      description="site.seo.description ?: site.subtitle"
      image="site.logo"
      type="website"
    ></include>
  </template>

  <header class="page-heading">
    <p
      class="eyebrow"
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '站点连接' : 'Connections'}"
    >
      Connections
    </p>
    <h1 th:text="${linksTitle}">Links</h1>
    <p
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '发现值得长期阅读的独立网站与创作者。' : 'Independent sites and creators worth following.'}"
    >
      Independent sites and creators worth following.
    </p>
  </header>

  <nav
    class="link-groups"
    th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '友链分组' : 'Link groups'}"
    th:if="${not #lists.isEmpty(simpleGroups)}"
  >
    <a
      th:href="@{/links}"
      th:classappend="${group == null} ? ' is-active'"
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '全部' : 'All'}"
      >All</a
    >
    <a
      th:each="item : ${simpleGroups}"
      th:href="@{/links(group=${item.metadata.name})}"
      th:classappend="${group == item.metadata.name} ? ' is-active'"
      th:text="${item.spec.displayName}"
    ></a>
  </nav>

  <ul class="friend-grid" th:if="${not #lists.isEmpty(links)}">
    <li th:each="link : ${links}">
      <a th:href="@{${link.spec.url}}" target="_blank" rel="friend noopener noreferrer">
        <img
          th:if="${not #strings.isEmpty(link.spec.logo)}"
          th:src="${link.spec.logo}"
          th:alt="${link.spec.displayName}"
          width="44"
          height="44"
          loading="lazy"
          decoding="async"
        />
        <span>
          <strong th:text="${link.spec.displayName}">Site name</strong>
          <small
            th:if="${not #strings.isEmpty(link.spec.description)}"
            th:text="${link.spec.description}"
          ></small>
        </span>
        <i data-lucide="external-link" aria-hidden="true"></i>
      </a>
    </li>
  </ul>

  <div class="empty-state" th:if="${#lists.isEmpty(links)}">
    <h2
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '暂时没有公开链接' : 'No public links yet'}"
    >
      No public links yet
    </h2>
    <p
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '请在 Halo 链接管理插件中添加并发布友情链接。' : 'Add and publish links with the Halo Links plugin.'}"
    >
      Add and publish links with the Halo Links plugin.
    </p>
  </div>

  <section class="comments comments--page" th:if="${haloCommentEnabled}">
    <h2 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '留言' : 'Messages'}">Messages</h2>
    <halo:comment group="plugin.halo.run" kind="Plugin" th:attr="name=${pluginName}" />
  </section>
</include>
