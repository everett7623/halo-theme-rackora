<include src="layout.html">
  <template name="head">
    <title th:text="${site.title}">首页</title>
    <include
      src="seo-head.html"
      path="posts.page > 1 ? '/page/' + posts.page : '/'"
      title="site.title"
      description="site.seo.description ?: site.subtitle"
      image="site.logo"
      type="website"
    ></include>
    <script type="application/ld+json" th:inline="javascript">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": /*[[${site.title}]]*/ "站点标题",
        "url": /*[[${site.url}]]*/ "https://example.com/",
        "description": /*[[${site.seo.description}]]*/ "",
        "inLanguage": /*[[${theme.config.basic.site_language ?: 'en-US'}]]*/ "en-US",
        "publisher": {
          "@id": /*[[${site.url + '#organization'}]]*/ "https://example.com/#organization"
        }
      }
    </script>
    <script type="application/ld+json" th:inline="javascript">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": /*[[${site.url + '#organization'}]]*/ "https://example.com/#organization",
        "name": /*[[${theme.config.seo.organization_name ?: site.title}]]*/ "Site",
        "url": /*[[${site.url}]]*/ "https://example.com/",
        "mainEntityOfPage": /*[[${theme.config.seo.about_url ?: site.url}]]*/ "https://example.com/",
        "logo": {
          "@type": "ImageObject",
          "url": /*[[${theme.config.seo.organization_logo ?: (#strings.isEmpty(site.logo) ? #theme.assets('/images/rackora-mark.svg') : site.logo)}]]*/ ""
        },
        "sameAs": /*[[${theme.config.basic.socials.?[not #strings.isEmpty(url)].![url]}]]*/ []
      }
    </script>
  </template>

  <figure class="home-banner" th:if="${not #strings.isEmpty(theme.config.appearance.banner_image)}">
    <img
      th:src="${theme.config.appearance.banner_image}"
      th:alt="|${site.title} banner|"
      width="1600"
      height="480"
      decoding="async"
      fetchpriority="high"
    />
  </figure>

  <div
    class="home-grid"
    th:with="showHomeSidebar = ${theme.config.home?.show_home_sidebar != null ? theme.config.home.show_home_sidebar : (theme.config.content?.show_home_sidebar == null or theme.config.content.show_home_sidebar)}"
    th:classappend="${showHomeSidebar} ? '' : ' home-grid--single'"
  >
    <section class="content-section" aria-labelledby="latest-title">
      <include src="ad-slot.html" position="home_top"></include>

      <header class="section-heading">
        <h1
          id="latest-title"
          th:text="${theme.config.basic.ui_language == 'zh-CN' ? '最新文章' : 'Latest posts'}"
        >
          Latest posts
        </h1>
        <a
          class="text-link"
          th:href="@{${site.routes.archivesUri}}"
          th:text="${theme.config.basic.ui_language == 'zh-CN' ? '查看归档' : 'View archives'}"
          >View archives</a
        >
      </header>

      <ul class="post-list post-list--cards" th:if="${not #lists.isEmpty(posts.items)}">
        <include src="post-card.html"></include>
      </ul>
      <div class="empty-state" th:if="${#lists.isEmpty(posts.items)}">
        <h2
          th:text="${theme.config.basic.ui_language == 'zh-CN' ? '暂时没有公开文章' : 'No public posts yet'}"
        >
          No public posts yet
        </h2>
        <p
          th:text="${theme.config.basic.ui_language == 'zh-CN' ? '发布第一篇内容后，它会显示在这里。' : 'Your first published post will appear here.'}"
        >
          Your first published post will appear here.
        </p>
      </div>

      <include src="pagination.html"></include>
    </section>

    <aside
      class="home-sidebar"
      th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '站点信息' : 'Site information'}"
      th:if="${showHomeSidebar}"
      th:with="showHomeStats = ${theme.config.basic.show_home_stats != null ? theme.config.basic.show_home_stats : (theme.config.stats?.show_home_stats == null or theme.config.stats.show_home_stats)},siteLaunchDate = ${theme.config.basic.site_launch_date ?: theme.config.stats?.site_launch_date},showHomeProfile = ${theme.config.home?.show_home_profile != null ? theme.config.home.show_home_profile : (theme.config.content?.show_home_profile == null or theme.config.content.show_home_profile)},showHomeCategories = ${theme.config.home?.show_home_categories != null ? theme.config.home.show_home_categories : (theme.config.content?.show_home_categories == null or theme.config.content.show_home_categories)},showHomeTags = ${theme.config.home?.show_home_tags != null ? theme.config.home.show_home_tags : (theme.config.content?.show_home_tags == null or theme.config.content.show_home_tags)},homeTagCount = ${theme.config.home?.home_tag_count ?: theme.config.content?.home_tag_count ?: 10},hasHomeSocials = ${not #lists.isEmpty(theme.config.basic.socials.?[not #strings.isEmpty(name) and not #strings.isEmpty(url)])}"
    >
      <section
        class="profile-panel"
        th:if="${(showHomeProfile and hasHomeSocials) or showHomeStats}"
        th:classappend="${showHomeProfile and hasHomeSocials and showHomeStats} ? ' profile-panel--split' : ''"
      >
        <th:block th:if="${showHomeProfile and hasHomeSocials}">
          <p
            class="profile-panel__label"
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '关注' : 'Connect'}"
          >
            Connect
          </p>
          <nav
            class="profile-socials"
            th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '社交账号' : 'Social profiles'}"
          >
            <a
              th:each="social : ${theme.config.basic.socials}"
              th:if="${not #strings.isEmpty(social.name) and not #strings.isEmpty(social.url)}"
              th:href="@{${social.url}}"
              th:title="${social.name}"
              th:attr="aria-label=${social.name}"
              target="_blank"
              rel="me noopener noreferrer"
            >
              <i th:attr="data-lucide=${social.icon ?: 'globe'}" aria-hidden="true"></i>
            </a>
          </nav>
        </th:block>

        <dl
          class="profile-stats"
          th:if="${showHomeStats}"
          th:with="siteStats = ${siteStatsFinder.getStats()}"
        >
          <div>
            <dt th:text="${theme.config.basic.ui_language == 'zh-CN' ? '访问' : 'Visits'}">
              Visits
            </dt>
            <dd th:text="${siteStats.visit ?: 0}">0</dd>
          </div>
          <div>
            <dt th:text="${theme.config.basic.ui_language == 'zh-CN' ? '文章' : 'Posts'}">Posts</dt>
            <dd th:text="${siteStats.post ?: 0}">0</dd>
          </div>
          <div>
            <dt th:text="${theme.config.basic.ui_language == 'zh-CN' ? '评论' : 'Comments'}">
              Comments
            </dt>
            <dd th:text="${siteStats.comment ?: 0}">0</dd>
          </div>
          <div>
            <dt th:text="${theme.config.basic.ui_language == 'zh-CN' ? '分类' : 'Categories'}">
              Categories
            </dt>
            <dd th:text="${siteStats.category ?: 0}">0</dd>
          </div>
          <div th:if="${not #strings.isEmpty(siteLaunchDate)}">
            <dt th:text="${theme.config.basic.ui_language == 'zh-CN' ? '运行' : 'Days'}">Days</dt>
            <dd data-site-launch-compact th:attr="data-site-launch=${siteLaunchDate}">--</dd>
          </div>
        </dl>
      </section>

      <th:block th:if="${showHomeCategories}">
        <th:block th:with="homeCategories = ${categoryFinder.listAll()}">
          <section class="sidebar-panel" th:if="${not #lists.isEmpty(homeCategories)}">
            <header>
              <h2
                th:text="${theme.config.basic.ui_language == 'zh-CN' ? '内容栏目' : 'Categories'}"
              >
                Categories
              </h2>
              <a
                th:href="@{${site.routes.categoriesUri}}"
                th:text="${theme.config.basic.ui_language == 'zh-CN' ? '全部' : 'All'}"
                >All</a
              >
            </header>
            <ul>
              <li th:each="category : ${homeCategories}">
                <a th:href="@{${category.status.permalink}}">
                  <span th:text="${category.spec.displayName}">栏目</span>
                  <small th:text="${category.postCount}">0</small>
                </a>
              </li>
            </ul>
          </section>
        </th:block>
      </th:block>

      <th:block th:if="${showHomeTags}">
        <th:block th:with="homeTags = ${tagFinder.listAll()}">
          <section
            class="sidebar-panel sidebar-panel--tags"
            th:if="${not #lists.isEmpty(homeTags)}"
          >
            <header>
              <h2 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '标签' : 'Tags'}">Tags</h2>
              <a
                th:href="@{${site.routes.tagsUri}}"
                th:text="${theme.config.basic.ui_language == 'zh-CN' ? '全部' : 'All'}"
                >All</a
              >
            </header>
            <ul class="sidebar-tag-list" data-popular-tags th:attr="data-tag-limit=${homeTagCount}">
              <li th:each="tag : ${homeTags}" th:attr="data-tag-count=${tag.postCount}">
                <a th:href="@{${tag.status.permalink}}" th:text="${tag.spec.displayName}">Tag</a>
              </li>
            </ul>
          </section>
        </th:block>
      </th:block>

      <include src="ad-slot.html" position="home_sidebar"></include>
    </aside>
  </div>
</include>
