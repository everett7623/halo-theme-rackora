<include src="layout.html">
  <template name="head">
    <title th:text="${site.title}">首页</title>
    <include
      src="seo-head.html"
      path="posts.page > 1 ? '/page/' + posts.page : '/'"
      title="site.title"
      description="site.seo.description ?: site.subtitle"
      image="site.logo"
      type="website"
    ></include>
    <th:block
      th:with="siteBase = ${#strings.endsWith(site.url, '/') ? #strings.substring(site.url, 0, #strings.length(site.url) - 1) : site.url},logoRaw = ${theme.config.seo.organization_logo ?: (#strings.isEmpty(site.logo) ? #theme.assets('/images/rackora-mark.svg') : site.logo)},logoAbs = ${(#strings.startsWith(logoRaw, 'https://') or #strings.startsWith(logoRaw, 'http://')) ? logoRaw : siteBase + (#strings.startsWith(logoRaw, '/') ? logoRaw : '/' + logoRaw)},orgId = ${siteBase + '#organization'}"
    >
      <script type="application/ld+json" th:inline="javascript">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": /*[[${site.title}]]*/ "站点标题",
          "url": /*[[${siteBase + '/'}]]*/ "https://example.com/",
          "description": /*[[${site.seo.description}]]*/ "",
          "inLanguage": /*[[${theme.config.basic.site_language ?: 'en-US'}]]*/ "en-US",
          "publisher": {
            "@id": /*[[${orgId}]]*/ "https://example.com#organization"
          }
        }
      </script>
      <script type="application/ld+json" th:inline="javascript">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "@id": /*[[${orgId}]]*/ "https://example.com#organization",
          "name": /*[[${theme.config.seo.organization_name ?: site.title}]]*/ "Site",
          "url": /*[[${siteBase + '/'}]]*/ "https://example.com/",
          "mainEntityOfPage": /*[[${theme.config.seo.about_url ?: (siteBase + '/')}]]*/ "https://example.com/",
          "logo": {
            "@type": "ImageObject",
            "url": /*[[${logoAbs}]]*/ "https://example.com/logo.svg"
          },
          "sameAs": /*[[${theme.config.basic.socials.?[not #strings.isEmpty(url)].![url]}]]*/ []
        }
      </script>
    </th:block>
  </template>

  <figure class="home-banner" th:if="${not #strings.isEmpty(theme.config.appearance.banner_image)}">
    <img
      th:src="${theme.config.appearance.banner_image}"
      th:alt="|${site.title} banner|"
      width="1600"
      height="480"
      decoding="async"
      fetchpriority="high"
    />
  </figure>

  <div
    class="home-grid"
    th:with="showHomeSidebar = ${theme.config.home?.show_home_sidebar != null ? theme.config.home.show_home_sidebar : (theme.config.content?.show_home_sidebar == null or theme.config.content.show_home_sidebar)},
      isZhCN = ${theme.config.basic?.ui_language == 'zh-CN'},
      homeEyebrow = ${theme.config.appearance?.home_eyebrow},
      homeTagline = ${theme.config.appearance?.home_tagline},
      homeEyebrowText = ${(homeEyebrow != null and not #strings.isEmpty(homeEyebrow)) ? homeEyebrow : (isZhCN ? '独立出版' : 'Independent publishing')},
      homeTaglineText = ${(homeTagline != null and not #strings.isEmpty(homeTagline)) ? homeTagline : (isZhCN ? '清晰表达，长期可读' : 'Written for clarity and longevity')}"
    th:classappend="${showHomeSidebar} ? '' : ' home-grid--single'"
  >
    <section class="home-heading" aria-labelledby="home-title">
      <p class="home-heading__brand" th:text="${homeEyebrowText}">Independent publishing</p>
      <h1 id="home-title" th:text="${site.title}">站点标题</h1>
      <p th:if="${not #strings.isEmpty(site.subtitle)}" th:text="${site.subtitle}"></p>
      <div class="home-heading__meta">
        <span th:text="${isZhCN ? posts.total + ' 篇内容' : posts.total + ' posts'}">0 posts</span>
        <span th:text="${homeTaglineText}">Written for clarity and longevity</span>
      </div>
    </section>

    <section class="content-section" aria-labelledby="latest-title">
      <include src="ad-slot.html" position="home_top"></include>

      <header class="section-heading">
        <h2 id="latest-title" th:text="${isZhCN ? '最新文章' : 'Latest posts'}">Latest posts</h2>
        <a
          class="text-link"
          th:href="@{${site.routes.archivesUri}}"
          th:text="${isZhCN ? '查看归档' : 'View archives'}"
          >View archives</a
        >
      </header>

      <ul class="post-list post-list--cards" th:if="${not #lists.isEmpty(posts.items)}">
        <include src="post-card.html"></include>
      </ul>
      <div class="empty-state" th:if="${#lists.isEmpty(posts.items)}">
        <h2 th:text="${isZhCN ? '暂时没有公开文章' : 'No public posts yet'}">
          No public posts yet
        </h2>
        <p
          th:text="${isZhCN ? '发布第一篇内容后，它会显示在这里。' : 'Your first published post will appear here.'}"
        >
          Your first published post will appear here.
        </p>
      </div>

      <include src="pagination.html"></include>
    </section>

    <aside
      class="home-sidebar"
      th:attr="aria-label=${isZhCN ? '站点信息' : 'Site information'}"
      th:if="${showHomeSidebar}"
      th:with="showHomeStats = ${theme.config.basic.show_home_stats != null ? theme.config.basic.show_home_stats : (theme.config.stats?.show_home_stats == null or theme.config.stats.show_home_stats)},siteLaunchDate = ${theme.config.basic.site_launch_date ?: theme.config.stats?.site_launch_date},showHomeProfile = ${theme.config.home?.show_home_profile != null ? theme.config.home.show_home_profile : (theme.config.content?.show_home_profile == null or theme.config.content.show_home_profile)},showHomeCategories = ${theme.config.home?.show_home_categories != null ? theme.config.home.show_home_categories : (theme.config.content?.show_home_categories == null or theme.config.content.show_home_categories)},showHomeTags = ${theme.config.home?.show_home_tags != null ? theme.config.home.show_home_tags : (theme.config.content?.show_home_tags == null or theme.config.content.show_home_tags)},homeTagCount = ${theme.config.home?.home_tag_count ?: theme.config.content?.home_tag_count ?: 10},isZhCNSidebar = ${theme.config.basic?.ui_language == 'zh-CN'},squareLogo = ${theme.config.appearance?.square_logo},wideLogo = ${theme.config.appearance?.wide_logo},useWideLogo = ${theme.config.appearance?.logo_mode == 'wide' and not #strings.isEmpty(wideLogo)},profileLogo = ${useWideLogo ? wideLogo : (not #strings.isEmpty(squareLogo) ? squareLogo : (#strings.isEmpty(site.logo) ? #theme.assets('/images/rackora-mark.svg') : site.logo))}"
    >
      <section
        class="profile-panel"
        th:if="${showHomeProfile or showHomeStats}"
        th:classappend="|${showHomeProfile and showHomeStats ? ' profile-panel--split' : ''}${useWideLogo ? ' profile-panel--wide-logo' : ''}|"
      >
        <th:block th:if="${showHomeProfile}">
          <img
            class="profile-panel__mark"
            width="64"
            height="64"
            th:width="${useWideLogo ? 192 : 64}"
            th:height="64"
            th:src="${profileLogo}"
            th:alt="${site.title}"
          />
          <div class="profile-panel__copy" th:unless="${useWideLogo}">
            <h2 th:text="${site.title}">Rackora</h2>
            <p th:text="${site.subtitle ?: 'Independent publishing with clarity and care.'}"></p>
          </div>
          <nav
            class="profile-socials"
            th:attr="aria-label=${isZhCN ? '社交账号' : 'Social profiles'}"
            th:if="${not #lists.isEmpty(theme.config.basic.socials)}"
          >
            <a
              th:each="social : ${theme.config.basic.socials}"
              th:if="${not #strings.isEmpty(social.name) and not #strings.isEmpty(social.url)}"
              th:href="@{${social.url}}"
              th:title="${social.name}"
              th:attr="aria-label=${social.name}"
              target="_blank"
              rel="me noopener noreferrer"
            >
              <i th:attr="data-lucide=${social.icon ?: 'globe'}" aria-hidden="true"></i>
            </a>
          </nav>
        </th:block>

        <dl
          class="profile-stats"
          th:if="${showHomeStats}"
          th:with="siteStats = ${siteStatsFinder.getStats()}"
        >
          <div>
            <dt th:text="${isZhCNSidebar ? '访问' : 'Visits'}">Visits</dt>
            <dd th:text="${siteStats.visit ?: 0}">0</dd>
          </div>
          <div>
            <dt th:text="${isZhCNSidebar ? '文章' : 'Posts'}">Posts</dt>
            <dd th:text="${siteStats.post ?: 0}">0</dd>
          </div>
          <div>
            <dt th:text="${isZhCNSidebar ? '评论' : 'Comments'}">Comments</dt>
            <dd th:text="${siteStats.comment ?: 0}">0</dd>
          </div>
          <div>
            <dt th:text="${isZhCNSidebar ? '分类' : 'Categories'}">Categories</dt>
            <dd th:text="${siteStats.category ?: 0}">0</dd>
          </div>
          <div th:if="${not #strings.isEmpty(siteLaunchDate)}">
            <dt th:text="${isZhCNSidebar ? '运行' : 'Days'}">Days</dt>
            <dd data-site-launch-compact th:attr="data-site-launch=${siteLaunchDate}">--</dd>
          </div>
        </dl>
      </section>

      <th:block th:if="${showHomeCategories}">
        <th:block th:with="homeCategories = ${categoryFinder.listAll()}">
          <section class="sidebar-panel" th:if="${not #lists.isEmpty(homeCategories)}">
            <header>
              <h2 th:text="${isZhCNSidebar ? '分类' : 'Categories'}">Categories</h2>
              <a
                th:href="@{${site.routes.categoriesUri}}"
                th:text="${isZhCNSidebar ? '全部' : 'All'}"
                >All</a
              >
            </header>
            <ul>
              <li th:each="category : ${homeCategories}">
                <a th:href="@{${category.status.permalink}}">
                  <span th:text="${category.spec.displayName}">栏目</span>
                  <small th:text="${category.postCount}">0</small>
                </a>
              </li>
            </ul>
          </section>
        </th:block>
      </th:block>

      <th:block th:if="${showHomeTags}">
        <th:block th:with="homeTags = ${tagFinder.listAll()}">
          <section
            class="sidebar-panel sidebar-panel--tags"
            th:if="${not #lists.isEmpty(homeTags)}"
          >
            <header>
              <h2 th:text="${isZhCNSidebar ? '标签' : 'Tags'}">Tags</h2>
              <a th:href="@{${site.routes.tagsUri}}" th:text="${isZhCNSidebar ? '全部' : 'All'}"
                >All</a
              >
            </header>
            <ul class="sidebar-tag-list" data-popular-tags th:attr="data-tag-limit=${homeTagCount}">
              <li th:each="tag : ${homeTags}" th:attr="data-tag-count=${tag.postCount}">
                <a th:href="@{${tag.status.permalink}}" th:text="${tag.spec.displayName}">Tag</a>
              </li>
            </ul>
          </section>
        </th:block>
      </th:block>

      <include src="ad-slot.html" position="home_sidebar"></include>
    </aside>
  </div>
</include>
