<nav
  class="share-bar"
  th:if="${showShareBar or showShareLink}"
  th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '分享文章' : 'Share this post'},data-share-title=${post.spec.title},data-share-url=@{${post.status.permalink}}"
  data-share-bar
>
  <span
    class="share-bar__label"
    th:text="${theme.config.basic.ui_language == 'zh-CN' ? '分享' : 'Share'}"
    >Share</span
  >
  <a
    class="share-bar__button"
    th:if="${showShareBar and shareX}"
    href="#"
    data-share="x"
    target="_blank"
    rel="noopener noreferrer"
    th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 X' : 'Share on X'},title=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 X' : 'Share on X'}"
  >
    <span class="share-bar__x-mark" aria-hidden="true">X</span>
  </a>
  <a
    class="share-bar__button"
    th:if="${showShareBar and shareFacebook}"
    href="#"
    data-share="facebook"
    target="_blank"
    rel="noopener noreferrer"
    th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 Facebook' : 'Share on Facebook'},title=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 Facebook' : 'Share on Facebook'}"
  >
    <i data-lucide="facebook" aria-hidden="true"></i>
  </a>
  <a
    class="share-bar__button"
    th:if="${showShareBar and shareLinkedin}"
    href="#"
    data-share="linkedin"
    target="_blank"
    rel="noopener noreferrer"
    th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 LinkedIn' : 'Share on LinkedIn'},title=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 LinkedIn' : 'Share on LinkedIn'}"
  >
    <i data-lucide="linkedin" aria-hidden="true"></i>
  </a>
  <a
    class="share-bar__button"
    th:if="${showShareBar and shareReddit}"
    href="#"
    data-share="reddit"
    target="_blank"
    rel="noopener noreferrer"
    th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 Reddit' : 'Share on Reddit'},title=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 Reddit' : 'Share on Reddit'}"
  >
    <i data-lucide="messages-square" aria-hidden="true"></i>
  </a>
  <a
    class="share-bar__button"
    th:if="${showShareBar and shareTelegram}"
    href="#"
    data-share="telegram"
    target="_blank"
    rel="noopener noreferrer"
    th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 Telegram' : 'Share on Telegram'},title=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 Telegram' : 'Share on Telegram'}"
  >
    <i data-lucide="send" aria-hidden="true"></i>
  </a>
  <a
    class="share-bar__button"
    th:if="${showShareBar and shareWhatsapp}"
    href="#"
    data-share="whatsapp"
    target="_blank"
    rel="noopener noreferrer"
    th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 WhatsApp' : 'Share on WhatsApp'},title=${theme.config.basic.ui_language == 'zh-CN' ? '分享到 WhatsApp' : 'Share on WhatsApp'}"
  >
    <i data-lucide="message-circle" aria-hidden="true"></i>
  </a>
  <a
    class="share-bar__button"
    th:if="${showShareBar and shareWeibo}"
    href="#"
    data-share="weibo"
    target="_blank"
    rel="noopener noreferrer"
    th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '分享到微博' : 'Share on Weibo'},title=${theme.config.basic.ui_language == 'zh-CN' ? '分享到微博' : 'Share on Weibo'}"
  >
    <i data-lucide="globe" aria-hidden="true"></i>
  </a>
  <a
    class="share-bar__button"
    th:if="${showShareBar and shareEmail}"
    href="#"
    data-share="email"
    th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '通过邮件分享' : 'Share by email'},title=${theme.config.basic.ui_language == 'zh-CN' ? '通过邮件分享' : 'Share by email'}"
  >
    <i data-lucide="mail" aria-hidden="true"></i>
  </a>
  <button
    class="share-bar__button"
    type="button"
    th:if="${showShareLink}"
    data-share-link
    th:attr="data-share-url=@{${post.status.permalink}},aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '复制文章链接' : 'Copy post link'},title=${theme.config.basic.ui_language == 'zh-CN' ? '复制文章链接' : 'Copy post link'}"
  >
    <i data-lucide="copy" aria-hidden="true"></i>
  </button>
</nav>
