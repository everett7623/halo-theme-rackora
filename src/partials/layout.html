<!doctype html>
<html
  {{layoutFragment}}
  th:lang="${theme.config.basic.site_language ?: 'en-US'}"
  xmlns:th="http://www.thymeleaf.org"
  th:attr="data-color-scheme=${theme.config.appearance.color_scheme ?: 'auto'},data-ui-language=${theme.config.basic.ui_language ?: 'en'},data-content-width=${theme.config.appearance.content_width ?: 'comfortable'},data-font-scale=${theme.config.appearance.font_scale ?: 'md'}"
  th:class="|color-scheme-${theme.config.appearance.color_scheme ?: 'auto'} content-width-${theme.config.appearance.content_width ?: 'comfortable'} font-scale-${theme.config.appearance.font_scale ?: 'md'}|"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101714" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      th:if="${#strings.isEmpty(site.favicon)}"
      th:href="${#theme.assets('/images/rackora-mark.svg')}"
    />
    <meta
      name="geo.region"
      th:if="${not #strings.isEmpty(theme.config.basic.site_region)}"
      th:content="${theme.config.basic.site_region}"
    />
    <link
      rel="alternate"
      type="application/rss+xml"
      th:if="${pluginFinder.available('PluginFeed')}"
      th:title="|${site.title} RSS|"
      th:href="@{${#strings.isEmpty(theme.config.basic.rss_url) ? '/rss.xml' : theme.config.basic.rss_url}}"
    />
    <meta
      name="google-site-verification"
      th:if="${not #strings.isEmpty(theme.config.seo.google_verification)}"
      th:content="${theme.config.seo.google_verification}"
    />
    <meta
      name="msvalidate.01"
      th:if="${not #strings.isEmpty(theme.config.seo.bing_verification)}"
      th:content="${theme.config.seo.bing_verification}"
    />
    <meta
      name="baidu-site-verification"
      th:if="${not #strings.isEmpty(theme.config.seo.baidu_verification)}"
      th:content="${theme.config.seo.baidu_verification}"
    />
    <slot name="head">
      <title th:text="${site.title}">Site title</title>
    </slot>
    <script>
      (() => {
        try {
          const savedScheme = localStorage.getItem("rackora-color-scheme");
          if (savedScheme === "light" || savedScheme === "dark") {
            document.documentElement.dataset.colorScheme = savedScheme;
            document.documentElement.classList.remove(
              "color-scheme-auto",
              "color-scheme-light",
              "color-scheme-dark",
            );
            document.documentElement.classList.add(`color-scheme-${savedScheme}`);
          }
        } catch (_) {
          // Storage can be unavailable in privacy modes; the server setting remains authoritative.
        }
      })();
    </script>
    <script type="module" src="/js/main.ts"></script>
    <script
      async
      th:if="${theme.config.analytics?.enabled and #strings.startsWith(theme.config.analytics.ga4_id ?: '', 'G-')}"
      th:src="|https://www.googletagmanager.com/gtag/js?id=${theme.config.analytics.ga4_id}|"
    ></script>
    <script
      th:if="${theme.config.analytics?.enabled and #strings.startsWith(theme.config.analytics.ga4_id ?: '', 'G-')}"
      th:inline="javascript"
    >
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", /*[[${theme.config.analytics.ga4_id}]]*/ "");
    </script>
    <script
      th:if="${theme.config.analytics?.enabled and not #strings.isEmpty(theme.config.analytics.clarity_id)}"
      th:inline="javascript"
    >
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", /*[[${theme.config.analytics.clarity_id}]]*/ "");
    </script>
    <script
      th:if="${theme.config.analytics?.enabled and #strings.length(theme.config.analytics.baidu_analytics_id ?: '') == 32}"
      th:inline="javascript"
    >
      window._hmt = window._hmt || [];
      (function () {
        const script = document.createElement("script");
        script.async = true;
        script.src =
          "https://hm.baidu.com/hm.js?" + /*[[${theme.config.analytics.baidu_analytics_id}]]*/ "";
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body th:style="|--rack-accent-user: ${theme.config.appearance.accent_color ?: '#08775b'}|">
    <a
      class="skip-link"
      href="#main-content"
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '跳到正文' : 'Skip to content'}"
      >Skip to content</a
    >

    <header class="site-header site-header--compact">
      <div class="shell header-inner">
        <a
          class="brand"
          th:with="useWideLogo = ${theme.config.appearance?.logo_mode == 'wide' and not #strings.isEmpty(site.logo)}"
          th:classappend="${useWideLogo} ? ' brand--wide' : ' brand--square'"
          th:href="@{/}"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '返回首页' : 'Back to home'}"
        >
          <img
            class="brand-mark"
            width="34"
            height="34"
            th:width="${useWideLogo ? 108 : 34}"
            th:height="${useWideLogo ? 36 : 34}"
            th:src="${#strings.isEmpty(site.logo) ? #theme.assets('/images/rackora-mark.svg') : site.logo}"
            th:alt="${site.title}"
          />
          <span class="brand-copy" th:unless="${useWideLogo}">
            <strong th:text="${site.title}">Rackora</strong>
            <small
              th:if="${not #strings.isEmpty(site.subtitle)}"
              th:text="${site.subtitle}"
            ></small>
          </span>
        </a>

        <button
          class="icon-button nav-toggle"
          type="button"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '打开导航' : 'Open navigation'}"
          aria-controls="primary-nav"
          aria-expanded="false"
          data-nav-toggle
        >
          <i data-lucide="menu" aria-hidden="true"></i>
        </button>

        <nav
          id="primary-nav"
          class="site-nav"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '主导航' : 'Primary navigation'}"
          th:with="menu = ${menuFinder.getPrimary()}"
          data-site-nav
        >
          <ul th:if="${menu != null and not #lists.isEmpty(menu.menuItems)}">
            <li
              th:each="item : ${menu.menuItems}"
              th:classappend="${not #lists.isEmpty(item.children)} ? ' has-children'"
            >
              <a
                th:href="@{${item.status.href}}"
                th:text="${item.status.displayName}"
                th:target="${item.spec.target?.value}"
                th:rel="${item.spec.target?.value == '_blank' ? 'noopener noreferrer' : null}"
              ></a>
              <ul class="submenu" th:if="${not #lists.isEmpty(item.children)}">
                <li th:each="child : ${item.children}">
                  <a
                    th:href="@{${child.status.href}}"
                    th:text="${child.status.displayName}"
                    th:target="${child.spec.target?.value}"
                    th:rel="${child.spec.target?.value == '_blank' ? 'noopener noreferrer' : null}"
                  ></a>
                </li>
              </ul>
            </li>
          </ul>
          <ul class="fallback-nav" th:if="${menu == null or #lists.isEmpty(menu.menuItems)}">
            <li>
              <a
                th:href="@{/}"
                th:text="${theme.config.basic.ui_language == 'zh-CN' ? '首页' : 'Home'}"
                >Home</a
              >
            </li>
            <li>
              <a
                th:href="@{${site.routes.archivesUri}}"
                th:text="${theme.config.basic.ui_language == 'zh-CN' ? '归档' : 'Archives'}"
                >Archives</a
              >
            </li>
            <li>
              <a
                th:href="@{${site.routes.categoriesUri}}"
                th:text="${theme.config.basic.ui_language == 'zh-CN' ? '栏目' : 'Categories'}"
                >Categories</a
              >
            </li>
          </ul>
        </nav>

        <div class="header-actions">
          <button
            class="icon-button"
            type="button"
            th:title="${theme.config.basic.ui_language == 'zh-CN' ? '搜索' : 'Search'}"
            th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '搜索' : 'Search'}"
            th:if="${pluginFinder.available('PluginSearchWidget')}"
            onclick="SearchWidget.open()"
          >
            <i data-lucide="search" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button"
            type="button"
            th:title="${theme.config.basic.ui_language == 'zh-CN' ? '切换配色' : 'Toggle color scheme'}"
            th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '切换配色' : 'Toggle color scheme'}"
            data-theme-toggle
          >
            <i data-lucide="moon" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="site-main">
      <div class="shell">
        <slot />
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <div>
          <strong th:text="${site.title}">Rackora</strong>
          <p
            th:if="${not #strings.isEmpty(theme.config.basic.footer_note)}"
            th:text="${theme.config.basic.footer_note}"
          ></p>
        </div>
        <nav
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '页脚导航' : 'Footer navigation'}"
          th:if="${theme.config.basic.show_footer_menu == null or theme.config.basic.show_footer_menu}"
          th:with="footerMenu = ${#strings.isEmpty(theme.config.basic.footer_menu) ? null : menuFinder.getByName(theme.config.basic.footer_menu)}"
        >
          <th:block th:if="${not #lists.isEmpty(footerMenu?.menuItems)}">
            <a
              th:each="item : ${footerMenu.menuItems}"
              th:href="@{${item.status.href}}"
              th:text="${item.status.displayName}"
              th:target="${item.spec.target?.value}"
              th:rel="${item.spec.target?.value == '_blank' ? 'noopener noreferrer' : null}"
            ></a>
          </th:block>
          <th:block th:if="${#lists.isEmpty(footerMenu?.menuItems)}">
            <a
              th:href="@{${site.routes.archivesUri}}"
              th:text="${theme.config.basic.ui_language == 'zh-CN' ? '归档' : 'Archives'}"
              >Archives</a
            >
            <a
              th:href="@{${site.routes.categoriesUri}}"
              th:text="${theme.config.basic.ui_language == 'zh-CN' ? '栏目' : 'Categories'}"
              >Categories</a
            >
            <a
              th:href="@{${site.routes.tagsUri}}"
              th:text="${theme.config.basic.ui_language == 'zh-CN' ? '标签' : 'Tags'}"
              >Tags</a
            >
            <a
              th:if="${(theme.config.integrations?.show_links ?: true) and (theme.config.integrations?.show_links_in_footer ?: true) and pluginFinder.available('PluginLinks')}"
              th:href="@{/links}"
              th:text="${theme.config.basic.ui_language == 'zh-CN' ? '友情链接' : 'Links'}"
              >Links</a
            >
            <a
              th:if="${pluginFinder.available('PluginFeed')}"
              th:href="@{${#strings.isEmpty(theme.config.basic.rss_url) ? '/rss.xml' : theme.config.basic.rss_url}}"
              >RSS</a
            >
          </th:block>
        </nav>
        <small>
          <span>Powered by Halo</span>
          <th:block
            th:if="${theme.config.basic.show_theme_credit == null or theme.config.basic.show_theme_credit}"
          >
            <span aria-hidden="true"> · </span>
            <a
              href="https://github.com/everett7623/halo-theme-rackora"
              rel="noopener"
              target="_blank"
              >Rackora</a
            >
            <span aria-hidden="true"> · </span>
            <a
              th:href="@{${theme.config.basic.studio_url ?: 'https://everettlabs.dev/'}}"
              rel="noopener"
              target="_blank"
              >Everett Labs</a
            >
          </th:block>
          <span th:if="${not #strings.isEmpty(theme.config.basic.site_region)}">
            <span aria-hidden="true"> · </span>
            <span
              th:text="${theme.config.basic.ui_language == 'zh-CN' ? '地区 ' + theme.config.basic.site_region : 'Region ' + theme.config.basic.site_region}"
              >Region</span
            >
          </span>
        </small>
        <p
          class="footer-compliance"
          th:if="${not #strings.isEmpty(theme.config.compliance?.icp_number) or not #strings.isEmpty(theme.config.compliance?.public_security_number)}"
        >
          <a
            th:if="${not #strings.isEmpty(theme.config.compliance?.icp_number) and not #strings.isEmpty(theme.config.compliance?.icp_url)}"
            th:href="@{${theme.config.compliance.icp_url}}"
            th:text="${theme.config.compliance.icp_number}"
            target="_blank"
            rel="noopener noreferrer"
          ></a>
          <span
            th:if="${not #strings.isEmpty(theme.config.compliance?.icp_number) and #strings.isEmpty(theme.config.compliance?.icp_url)}"
            th:text="${theme.config.compliance.icp_number}"
          ></span>
          <a
            th:if="${not #strings.isEmpty(theme.config.compliance?.public_security_number) and not #strings.isEmpty(theme.config.compliance?.public_security_url)}"
            th:href="@{${theme.config.compliance.public_security_url}}"
            th:text="${theme.config.compliance.public_security_number}"
            target="_blank"
            rel="noopener noreferrer"
          ></a>
          <span
            th:if="${not #strings.isEmpty(theme.config.compliance?.public_security_number) and #strings.isEmpty(theme.config.compliance?.public_security_url)}"
            th:text="${theme.config.compliance.public_security_number}"
          ></span>
        </p>
      </div>
      <halo:footer />
    </footer>

    <button
      class="back-to-top"
      type="button"
      th:title="${theme.config.basic.ui_language == 'zh-CN' ? '返回顶部' : 'Back to top'}"
      th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '返回顶部' : 'Back to top'}"
      data-back-to-top
    >
      <i data-lucide="chevron-up" aria-hidden="true"></i>
    </button>
  </body>
</html>
