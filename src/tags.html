<include src="layout.html">
  <template name="head">
    <title
      th:text="|${theme.config.basic.ui_language == 'zh-CN' ? '全部标签' : 'Tags'} - ${site.title}|"
    >
      Tags
    </title>
    <meta name="robots" content="noindex,follow" th:if="${theme.config.seo.noindex_tags}" />
  </template>

  <header class="archive-heading">
    <h1 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '全部标签' : 'Tags'}">Tags</h1>
    <p
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '按主题与内容线索浏览全部标签。' : 'Browse all tags by topic and context.'}"
    >
      Browse all tags by topic and context.
    </p>
  </header>

  <ul class="tag-cloud" th:if="${not #lists.isEmpty(tags)}">
    <li th:each="tag : ${tags}">
      <a th:href="@{${tag.status.permalink}}">
        <span th:text="${tag.spec.displayName}">Tag</span>
        <small th:text="${tag.postCount}">0</small>
      </a>
    </li>
  </ul>
  <div class="empty-state" th:if="${#lists.isEmpty(tags)}">
    <h2 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '尚未创建标签' : 'No tags yet'}">
      No tags yet
    </h2>
    <p
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '发布带标签的文章后，它们会显示在这里。' : 'Tags will appear after tagged posts are published.'}"
    >
      Tags will appear after tagged posts are published.
    </p>
  </div>
</include>
