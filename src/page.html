<include src="layout.html">
  <template name="head">
    <title th:text="|${singlePage.spec.title} - ${site.title}|">Page title</title>
    <include
      src="seo-head.html"
      path="singlePage.status.permalink"
      title="singlePage.spec.title"
      description="singlePage.status.excerpt"
      image="singlePage.spec.cover ?: site.logo"
      type="article"
    ></include>
    <script type="application/ld+json" th:inline="javascript">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "@id": /*[[${(#strings.endsWith(site.url, '/') ? #strings.substring(site.url, 0, #strings.length(site.url) - 1) : site.url) + singlePage.status.permalink}]]*/ "https://example.com/page",
        "url": /*[[${(#strings.endsWith(site.url, '/') ? #strings.substring(site.url, 0, #strings.length(site.url) - 1) : site.url) + singlePage.status.permalink}]]*/ "https://example.com/page",
        "name": /*[[${singlePage.spec.title}]]*/ "Page title",
        "description": /*[[${singlePage.status.excerpt ?: ''}]]*/ "",
        "inLanguage": /*[[${theme.config.basic.site_language ?: 'en-US'}]]*/ "en-US",
        "isPartOf": {
          "@type": "WebSite",
          "name": /*[[${site.title}]]*/ "Site",
          "url": /*[[${site.url}]]*/ "https://example.com/"
        },
        "publisher": {
          "@type": "Organization",
          "@id": /*[[${site.url + '#organization'}]]*/ "https://example.com/#organization",
          "name": /*[[${theme.config.seo.organization_name ?: site.title}]]*/ "Site"
        }
      }
    </script>
    <script type="module" src="./js/post.ts"></script>
  </template>

  <article class="article article--page" data-article>
    <header class="article-header">
      <h1 class="article-title" th:text="${singlePage.spec.title}">Page title</h1>
      <p
        class="article-deck"
        th:if="${not #strings.isEmpty(singlePage.status.excerpt)}"
        th:text="${singlePage.status.excerpt}"
      ></p>
    </header>
    <div
      class="article-content"
      th:utext="${singlePage.content.content}"
      data-article-content
    ></div>
  </article>

  <section
    class="comments comments--page"
    th:if="${haloCommentEnabled}"
    aria-labelledby="comments-title"
  >
    <h2
      id="comments-title"
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '评论' : 'Comments'}"
    >
      Comments
    </h2>
    <halo:comment
      group="content.halo.run"
      kind="SinglePage"
      th:attr="name=${singlePage.metadata.name}"
    />
  </section>
</include>
