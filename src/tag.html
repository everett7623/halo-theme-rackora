<include src="layout.html">
  <template name="head">
    <title th:text="|${tag.spec.displayName} - ${site.title}|">Tag</title>
    <include
      src="seo-head.html"
      path="tag.status.permalink"
      title="tag.spec.displayName + ' - ' + site.title"
      description="#annotations.get(tag, 'rackora_description') ?: site.seo.description"
      image="tag.spec.cover ?: site.logo"
      type="website"
    ></include>
    <meta
      name="robots"
      content="noindex,follow"
      th:if="${#annotations.getOrDefault(tag, 'rackora_index_policy', 'inherit') == 'noindex' or (#annotations.getOrDefault(tag, 'rackora_index_policy', 'inherit') == 'inherit' and theme.config.seo.noindex_tags)}"
    />
  </template>

  <header class="archive-heading">
    <h1 th:text="${tag.spec.displayName}">Tag</h1>
    <p
      th:if="${not #strings.isEmpty(#annotations.get(tag, 'rackora_description'))}"
      th:text="${#annotations.get(tag, 'rackora_description')}"
    ></p>
    <p
      th:if="${#strings.isEmpty(#annotations.get(tag, 'rackora_description'))}"
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? posts.total + ' 篇相关内容' : posts.total + ' related posts'}"
    >
      Related posts
    </p>
  </header>

  <ul class="post-list" th:if="${not #lists.isEmpty(posts.items)}">
    <include src="post-card.html"></include>
  </ul>
  <div class="empty-state" th:if="${#lists.isEmpty(posts.items)}">
    <h2
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '这个标签暂时没有文章' : 'No posts under this tag'}"
    >
      No posts under this tag
    </h2>
    <p
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '标签调整后，这里可能暂时为空。' : 'This tag may be empty while content is being reorganized.'}"
    >
      This tag may be empty while content is being reorganized.
    </p>
  </div>
  <include src="pagination.html"></include>
</include>
