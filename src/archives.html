<include src="layout.html">
  <template name="head">
    <title
      th:text="|${theme.config.basic.ui_language == 'zh-CN' ? '全部文章' : 'Archives'} - ${site.title}|"
    >
      Archives
    </title>
    <include
      src="seo-head.html"
      path="site.routes.archivesUri"
      title="(theme.config.basic.ui_language == 'zh-CN' ? '全部文章' : 'Archives') + ' - ' + site.title"
      description="site.seo.description ?: site.subtitle"
      image="site.logo"
      type="website"
    ></include>
    <meta name="robots" content="noindex,follow" th:if="${theme.config.seo.noindex_archives}" />
  </template>

  <header class="archive-heading">
    <h1 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '全部文章' : 'Archives'}">
      Archives
    </h1>
    <p
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '共 ' + archives.total + ' 篇公开内容，按发布时间整理。' : archives.total + ' public posts, organized by publish date.'}"
    >
      Public posts organized by publish date.
    </p>
  </header>

  <div class="timeline" th:if="${not #lists.isEmpty(archives.items)}">
    <section class="timeline-year" th:each="archive : ${archives.items}">
      <h2 th:text="${archive.year}">2026</h2>
      <div class="timeline-month" th:each="month : ${archive.months}">
        <h3
          th:text="${theme.config.basic.ui_language == 'zh-CN' ? month.month + ' 月' : 'Month ' + month.month}"
        >
          Month 1
        </h3>
        <ol>
          <li class="timeline-entry" th:each="post : ${month.posts}">
            <time
              class="timeline-entry__date"
              th:datetime="${post.spec.publishTime}"
              th:text="${#temporals.format(post.spec.publishTime, 'MM-dd')}"
            ></time>
            <a
              class="timeline-entry__title"
              th:href="@{${post.status.permalink}}"
              th:text="${post.spec.title}"
            ></a>
            <a
              class="timeline-entry__category"
              th:if="${not #lists.isEmpty(post.categories)}"
              th:href="@{${post.categories[0].status.permalink}}"
              th:text="${post.categories[0].spec.displayName}"
            ></a>
            <span
              class="timeline-entry__category timeline-entry__category--empty"
              th:if="${#lists.isEmpty(post.categories)}"
              th:text="${theme.config.basic.ui_language == 'zh-CN' ? '未分类' : 'Uncategorized'}"
              >Uncategorized</span
            >
          </li>
        </ol>
      </div>
    </section>
  </div>

  <div class="empty-state" th:if="${#lists.isEmpty(archives.items)}">
    <h2
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '归档还是空的' : 'The archive is empty'}"
    >
      The archive is empty
    </h2>
    <p
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '公开文章发布后会按年份和月份显示。' : 'Published posts will be organized here by year and month.'}"
    >
      Published posts will be organized here by year and month.
    </p>
  </div>

  <nav
    class="pagination"
    th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '归档分页' : 'Archive pagination'}"
    th:if="${archives.hasPrevious() || archives.hasNext()}"
  >
    <a class="pagination__link" th:if="${archives.hasPrevious()}" th:href="@{${archives.prevUrl}}">
      <i data-lucide="arrow-left" aria-hidden="true"></i
      ><span th:text="${theme.config.basic.ui_language == 'zh-CN' ? '上一页' : 'Previous'}"
        >Previous</span
      >
    </a>
    <span class="pagination__status" th:text="|${archives.page} / ${archives.totalPages}|"
      >1 / 1</span
    >
    <a class="pagination__link" th:if="${archives.hasNext()}" th:href="@{${archives.nextUrl}}">
      <span th:text="${theme.config.basic.ui_language == 'zh-CN' ? '下一页' : 'Next'}">Next</span
      ><i data-lucide="arrow-right" aria-hidden="true"></i>
    </a>
  </nav>
</include>
