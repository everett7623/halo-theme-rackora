<include src="layout.html">
  <template name="head">
    <title th:text="|${post.spec.title} - ${site.title}|">Documentation</title>
    <include
      src="seo-head.html"
      path="post.status.permalink"
      title="post.spec.title"
      description="post.status.excerpt"
      image="post.spec.cover ?: site.logo"
      type="article"
    ></include>
    <meta property="article:published_time" th:content="${post.spec.publishTime}" />
    <meta
      property="article:modified_time"
      th:content="${post.status.lastModifyTime != null and post.status.lastModifyTime.isAfter(post.spec.publishTime) ? post.status.lastModifyTime : post.spec.publishTime}"
    />
    <th:block
      th:with="siteBase = ${#strings.endsWith(site.url, '/') ? #strings.substring(site.url, 0, #strings.length(site.url) - 1) : site.url},logoRaw = ${theme.config.seo.organization_logo ?: (#strings.isEmpty(site.logo) ? #theme.assets('/images/rackora-mark.svg') : site.logo)},logoAbs = ${(#strings.startsWith(logoRaw, 'https://') or #strings.startsWith(logoRaw, 'http://')) ? logoRaw : siteBase + (#strings.startsWith(logoRaw, '/') ? logoRaw : '/' + logoRaw)},imageRaw = ${not #strings.isEmpty(post.spec.cover) ? post.spec.cover : logoRaw},imageAbs = ${(#strings.startsWith(imageRaw, 'https://') or #strings.startsWith(imageRaw, 'http://')) ? imageRaw : siteBase + (#strings.startsWith(imageRaw, '/') ? imageRaw : '/' + imageRaw)},orgId = ${siteBase + '#organization'}"
    >
      <script type="application/ld+json" th:inline="javascript">
        {
          "@context": "https://schema.org",
          "@type": "TechArticle",
          "@id": /*[[${siteBase + post.status.permalink}]]*/ "https://example.com/post",
          "url": /*[[${siteBase + post.status.permalink}]]*/ "https://example.com/post",
          "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": /*[[${siteBase + post.status.permalink}]]*/ "https://example.com/post"
          },
          "headline": /*[[${post.spec.title}]]*/ "Post title",
          "description": /*[[${post.status.excerpt ?: ''}]]*/ "",
          "inLanguage": /*[[${theme.config.basic.site_language ?: 'en-US'}]]*/ "en-US",
          "datePublished": /*[[${post.spec.publishTime}]]*/ "2026-01-01T00:00:00Z",
          "dateModified": /*[[${post.status.lastModifyTime != null and post.status.lastModifyTime.isAfter(post.spec.publishTime) ? post.status.lastModifyTime : post.spec.publishTime}]]*/ "2026-01-01T00:00:00Z",
          "author": {
            "@type": "Person",
            "name": /*[[${post.owner.displayName}]]*/ "Author",
            "url": /*[[${siteBase + post.owner.permalink}]]*/ "https://example.com/authors/author"
          },
          "publisher": {
            "@type": "Organization",
            "@id": /*[[${orgId}]]*/ "https://example.com#organization",
            "name": /*[[${theme.config.seo.organization_name ?: site.title}]]*/ "Site",
            "url": /*[[${siteBase + '/'}]]*/ "https://example.com/",
            "logo": {
              "@type": "ImageObject",
              "url": /*[[${logoAbs}]]*/ "https://example.com/logo.svg"
            }
          },
          "image": /*[[${imageAbs}]]*/ "https://example.com/logo.svg"
        }
      </script>
    </th:block>
    <script type="module" src="./js/post.ts"></script>
  </template>

  <div class="reading-progress" aria-hidden="true"><span data-reading-progress></span></div>
  <div class="article-layout article-layout--docs">
    <article class="article article--docs" data-article>
      <header class="article-header">
        <p
          class="eyebrow"
          th:text="${theme.config.basic.ui_language == 'zh-CN' ? '文档' : 'Documentation'}"
        >
          Documentation
        </p>
        <h1 class="article-title" th:text="${post.spec.title}">Documentation</h1>
        <p
          class="article-deck"
          th:if="${not #strings.isEmpty(post.status.excerpt)}"
          th:text="${post.status.excerpt}"
        ></p>
        <div class="article-meta">
          <time
            th:datetime="${post.spec.publishTime}"
            th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"
          ></time>
          <span
            data-reading-time
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '计算阅读时间' : 'Calculating reading time'}"
            >Calculating reading time</span
          >
        </div>
      </header>

      <div
        id="article-content"
        class="article-content"
        th:utext="${post.content.content}"
        data-article-content
        data-image-lightbox="true"
      ></div>

      <footer class="article-footer">
        <nav
          class="post-navigation"
          th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '相邻文章' : 'Adjacent posts'}"
          th:with="cursor = ${postFinder.cursor(post.metadata.name)}"
        >
          <a th:if="${cursor.hasPrevious()}" th:href="@{${cursor.previous.status.permalink}}">
            <span th:text="${theme.config.basic.ui_language == 'zh-CN' ? '上一篇' : 'Previous'}"
              >Previous</span
            >
            <strong th:text="${cursor.previous.spec.title}"></strong>
          </a>
          <a th:if="${cursor.hasNext()}" th:href="@{${cursor.next.status.permalink}}">
            <span th:text="${theme.config.basic.ui_language == 'zh-CN' ? '下一篇' : 'Next'}"
              >Next</span
            >
            <strong th:text="${cursor.next.spec.title}"></strong>
          </a>
        </nav>
      </footer>

      <section class="comments" th:if="${haloCommentEnabled}" aria-labelledby="comments-title">
        <h2
          id="comments-title"
          th:text="${theme.config.basic.ui_language == 'zh-CN' ? '评论' : 'Comments'}"
        >
          Comments
        </h2>
        <halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}" />
      </section>
    </article>

    <aside
      class="article-sidebar"
      th:attr="aria-label=${theme.config.basic.ui_language == 'zh-CN' ? '文档目录' : 'Documentation outline'}"
    >
      <section
        class="article-sidebar__section article-sidebar__section--docs"
        data-toc-container
        hidden
      >
        <header class="article-sidebar__heading">
          <span class="article-sidebar__heading-icon" aria-hidden="true">
            <i data-lucide="list"></i>
          </span>
          <h2 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '本页目录' : 'On this page'}">
            On this page
          </h2>
        </header>
        <nav data-toc></nav>
      </section>
      <section
        class="article-sidebar__section"
        th:if="${not #lists.isEmpty(post.categories)}"
        th:with="docsPosts = ${postFinder.list({page: 1, size: 8, categoryName: post.categories[0].metadata.name, sort: {'spec.publishTime,desc'}})}"
      >
        <header class="article-sidebar__heading">
          <span class="article-sidebar__heading-icon" aria-hidden="true">
            <i data-lucide="list"></i>
          </span>
          <h2
            th:text="${theme.config.basic.ui_language == 'zh-CN' ? '同栏目' : 'In this category'}"
          >
            In this category
          </h2>
        </header>
        <ol class="article-sidebar__posts">
          <li th:each="docsPost : ${docsPosts.items}">
            <a
              th:href="@{${docsPost.status.permalink}}"
              th:text="${docsPost.spec.title}"
              th:classappend="${docsPost.metadata.name == post.metadata.name} ? ' is-active'"
            ></a>
          </li>
        </ol>
      </section>
    </aside>
  </div>
</include>
