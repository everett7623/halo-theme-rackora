<include src="layout.html">
  <template name="head">
    <title th:text="|${author.spec.displayName} - ${site.title}|">作者</title>
  </template>

  <header class="author-heading">
    <img
      th:if="${not #strings.isEmpty(author.spec.avatar)}"
      th:src="${author.spec.avatar}"
      th:alt="${author.spec.displayName}"
      width="80"
      height="80"
    />
    <div>
      <h1 th:text="${author.spec.displayName}">作者</h1>
      <p th:if="${not #strings.isEmpty(author.spec.bio)}" th:text="${author.spec.bio}"></p>
      <p th:if="${#strings.isEmpty(author.spec.bio)}" th:text="|发布了 ${posts.total} 篇公开内容|">
        作者内容
      </p>
    </div>
  </header>

  <ul class="post-list" th:if="${not #lists.isEmpty(posts.items)}">
    <include src="post-card.html"></include>
  </ul>
  <div class="empty-state" th:if="${#lists.isEmpty(posts.items)}">
    <h2>该作者暂时没有公开文章</h2>
    <p>返回首页浏览其他内容。</p>
  </div>
  <include src="pagination.html"></include>
</include>
