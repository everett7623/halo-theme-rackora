<include src="layout.html">
  <template name="head">
    <title th:text="|${category.spec.displayName} - ${site.title}|">Category</title>
  </template>

  <header class="archive-heading">
    <h1 th:text="${category.spec.displayName}">Category</h1>
    <p
      th:if="${not #strings.isEmpty(category.spec.description)}"
      th:text="${category.spec.description}"
    ></p>
    <p
      th:if="${#strings.isEmpty(category.spec.description)}"
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? posts.total + ' 篇相关内容' : posts.total + ' related posts'}"
    >
      Related posts
    </p>
  </header>

  <th:block th:with="featuredPostName = ${#annotations.get(category, 'rackora_featured_post')}">
    <th:block th:if="${not #strings.isEmpty(featuredPostName)}">
      <aside
        class="featured-entry"
        th:with="featuredPost = ${postFinder.getByName(featuredPostName)}"
        th:if="${featuredPost != null}"
      >
        <small th:text="${theme.config.basic.ui_language == 'zh-CN' ? '精选内容' : 'Featured'}"
          >Featured</small
        >
        <a th:href="@{${featuredPost.status.permalink}}" th:text="${featuredPost.spec.title}"></a>
      </aside>
    </th:block>
  </th:block>

  <ul class="post-list" th:if="${not #lists.isEmpty(posts.items)}">
    <include src="post-card.html"></include>
  </ul>
  <div class="empty-state" th:if="${#lists.isEmpty(posts.items)}">
    <h2
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '这个栏目暂时没有文章' : 'No posts in this category'}"
    >
      No posts in this category
    </h2>
    <p
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '可以先浏览其他栏目或返回首页。' : 'Browse another category or return home.'}"
    >
      Browse another category or return home.
    </p>
  </div>
  <include src="pagination.html"></include>
</include>
