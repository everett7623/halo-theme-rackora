<include src="layout.html">
  <template name="head">
    <title
      th:text="|${theme.config.basic.ui_language == 'zh-CN' ? '全部栏目' : 'Categories'} - ${site.title}|"
    >
      Categories
    </title>
  </template>

  <header class="archive-heading">
    <h1 th:text="${theme.config.basic.ui_language == 'zh-CN' ? '全部栏目' : 'Categories'}">
      Categories
    </h1>
    <p
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '按站点的主要内容类型浏览文章。' : 'Browse posts by their primary content type.'}"
    >
      Browse posts by their primary content type.
    </p>
  </header>

  <ul class="taxonomy-grid" th:if="${not #lists.isEmpty(categories)}">
    <li th:each="category : ${categories}">
      <a th:href="@{${category.status.permalink}}">
        <strong th:text="${category.spec.displayName}">Category</strong>
        <span class="taxonomy-grid__count" th:text="${category.postCount}">0</span>
        <span
          th:text="${category.spec.description ?: (theme.config.basic.ui_language == 'zh-CN' ? '查看该栏目下的全部内容' : 'View every post in this category')}"
        ></span>
      </a>
      <ul class="taxonomy-children" th:if="${not #lists.isEmpty(category.children)}">
        <li th:each="child : ${category.children}">
          <a th:href="@{${child.status.permalink}}" th:text="${child.spec.displayName}"></a>
        </li>
      </ul>
    </li>
  </ul>
  <div class="empty-state" th:if="${#lists.isEmpty(categories)}">
    <h2
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '尚未创建栏目' : 'No categories yet'}"
    >
      No categories yet
    </h2>
    <p
      th:text="${theme.config.basic.ui_language == 'zh-CN' ? '在 Halo 后台建立栏目后，它们会显示在这里。' : 'Categories created in Halo will appear here.'}"
    >
      Categories created in Halo will appear here.
    </p>
  </div>
</include>
