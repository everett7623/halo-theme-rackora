apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-rackora-setting
spec:
  forms:
    - group: basic
      label: 资料
      formSchema:
        - $formkit: array
          name: socials
          label: 社交账号
          help: 显示在首页资料卡中，可拖动调整顺序，最多 6 个。
          value: []
          max: 6
          addLabel: 添加账号
          emptyText: 暂未添加社交账号
          itemLabels:
            - type: text
              label: $value.name
          children:
            - $formkit: select
              name: icon
              label: 图标
              value: globe
              options:
                - label: GitHub
                  value: github
                - label: X / Twitter
                  value: twitter
                - label: Telegram
                  value: send
                - label: 邮箱
                  value: mail
                - label: RSS
                  value: rss
                - label: 网站
                  value: globe
            - $formkit: text
              name: name
              label: 名称
              value: ""
              validation: required
            - $formkit: text
              name: url
              label: 地址
              help: "填写完整的 https://、mailto: 或其他有效链接。"
              value: ""
              validation: required
    - group: appearance
      label: 外观
      formSchema:
        - $formkit: radio
          name: color_scheme
          label: 默认配色
          value: auto
          options:
            - label: 跟随系统
              value: auto
            - label: 浅色
              value: light
            - label: 深色
              value: dark
        - $formkit: color
          name: accent_color
          label: 强调色
          value: "#08775b"
        - $formkit: attachment
          name: banner_image
          label: 首页横幅（可选）
          help: 留空即为极简无图首页；建议使用 1600×480 或更宽的图片。
          value: ""
    - group: content
      label: 内容
      formSchema:
        - $formkit: select
          name: image_mode
          label: 文章封面
          help: 默认为无图模式；文章封面仍可供 Halo 生成分享卡片。
          value: none
          options:
            - label: 不显示
              value: none
            - label: 仅文章列表
              value: list
            - label: 仅正文页
              value: article
            - label: 列表与正文
              value: all
        - $formkit: switch
          name: show_home_sidebar
          label: 首页资料侧栏
          help: 展示站点简介、社交账号、内容数量和栏目索引。
          value: true
    - group: seo
      label: SEO
      formSchema:
        - $formkit: switch
          name: noindex_tags
          label: 暂不索引标签页
          help: 标签治理完成前建议开启；标签总览和详情页输出 noindex,follow。不会修改 sitemap。
          value: true
        - $formkit: switch
          name: noindex_archives
          label: 暂不索引归档页
          help: 归档页主要用于浏览时建议开启；文章和栏目页面不受影响。
          value: true
        - $formkit: text
          name: google_verification
          label: Google 站点验证码
          help: 只填写 google-site-verification 的 content 值，不要粘贴完整 meta 标签。
          value: ""
        - $formkit: text
          name: bing_verification
          label: Bing 站点验证码
          help: 只填写 msvalidate.01 的 content 值。
          value: ""
        - $formkit: text
          name: baidu_verification
          label: 百度站点验证码
          help: 只填写 baidu-site-verification 的 content 值；标签格式以百度后台当前提供为准。
          value: ""
    - group: monetization
      label: 广告与联盟
      formSchema:
        - $formkit: switch
          name: enabled
          label: 启用主题广告位
          help: 关闭后所有主题广告位不渲染；正文中手动添加的链接不受影响。
          value: false
        - $formkit: textarea
          name: disclosure_text
          label: 推广披露文案
          help: 仅在实际显示主题广告时出现，保持简短、真实。
          rows: 2
          value: 本站可能通过推广链接获得佣金，不影响内容判断与用户价格。
        - $formkit: array
          name: ads
          label: 广告位
          help: 静态文字或图片广告，可拖动排序，最多 8 个；不支持任意脚本以保护性能和安全。
          value: []
          max: 8
          addLabel: 添加广告
          emptyText: 暂未添加广告
          itemLabels:
            - type: text
              label: $value.name
          children:
            - $formkit: switch
              name: enabled
              label: 启用
              value: true
            - $formkit: select
              name: position
              label: 展示位置
              value: home_top
              options:
                - label: 首页文章区顶部
                  value: home_top
                - label: 首页右侧栏
                  value: home_sidebar
                - label: 正文开始前
                  value: post_before
                - label: 正文结束后
                  value: post_after
            - $formkit: text
              name: name
              label: 广告名称
              value: ""
              validation: required
            - $formkit: textarea
              name: description
              label: 简短说明
              rows: 2
              value: ""
            - $formkit: attachment
              name: image
              label: 图片（可选）
              accepts:
                - image/*
              value: ""
            - $formkit: url
              name: url
              label: 跳转地址
              help: 推广地址会自动添加 sponsored、nofollow 和安全属性。
              value: ""
              validation: required
