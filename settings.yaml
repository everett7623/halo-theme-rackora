apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-rackora-setting
spec:
  forms:
    - group: basic
      label: 资料
      formSchema:
        - $formkit: select
          name: ui_language
          label: 主题界面语言
          help: 只切换主题自带文案；文章、菜单和站点资料保持原内容。
          value: en
          options:
            - label: English
              value: en
            - label: 简体中文
              value: zh-CN
        - $formkit: array
          name: socials
          label: 社交账号
          help: 显示在首页资料卡中，可拖动调整顺序，最多 6 个。
          value: []
          max: 6
          addLabel: 添加账号
          emptyText: 暂未添加社交账号
          itemLabels:
            - type: text
              label: $value.name
          children:
            - $formkit: select
              name: icon
              label: 图标
              value: globe
              options:
                - label: GitHub
                  value: github
                - label: X / Twitter
                  value: twitter
                - label: Telegram
                  value: send
                - label: 邮箱
                  value: mail
                - label: RSS
                  value: rss
                - label: 网站
                  value: globe
            - $formkit: text
              name: name
              label: 名称
              value: ""
              validation: required
            - $formkit: text
              name: url
              label: 地址
              help: "填写完整的 https://、mailto: 或其他有效链接。"
              value: ""
              validation: required
        - $formkit: text
          name: site_language
          label: 网站语言
          help: 用于 HTML lang 与结构化数据，例如 zh-CN、en-US。
          value: en-US
          validation: required
        - $formkit: text
          name: site_region
          label: 网站地区
          help: ISO 3166 地区代码，例如 CN、SG、US-CA；留空则不输出地区信号。
          value: ""
        - $formkit: url
          name: rss_url
          label: RSS 地址
          help: 安装官方 RSS 插件时通常填写站点的 /rss.xml；留空则自动使用 /rss.xml。
          value: ""
        - $formkit: text
          name: footer_note
          label: 页脚说明
          help: 留空则显示站点副标题。
          value: ""
        - $formkit: switch
          name: show_footer_menu
          label: 显示页脚菜单
          help: 关闭后隐藏页脚导航，备案信息和站点统计不受影响。
          value: true
        - $formkit: menuSelect
          name: footer_menu
          label: 页脚菜单
          help: 可选；留空使用主题自带的归档、栏目、标签等链接。
          clearable: true
          value: ""
        - $formkit: url
          name: studio_url
          label: 制作团队链接
          value: "https://everettlabs.dev/"
    - group: appearance
      label: 外观
      formSchema:
        - $formkit: radio
          name: color_scheme
          label: 默认配色
          value: auto
          options:
            - label: 跟随系统
              value: auto
            - label: 浅色
              value: light
            - label: 深色
              value: dark
        - $formkit: color
          name: accent_color
          label: 强调色
          value: "#08775b"
        - $formkit: attachment
          name: banner_image
          label: 首页横幅（可选）
          help: 留空即为极简无图首页；建议使用 1600×480 或更宽的图片。
          value: ""
    - group: content
      label: 内容
      formSchema:
        - $formkit: select
          name: image_mode
          label: 文章封面
          help: 默认为无图模式；文章封面仍可供 Halo 生成分享卡片。
          value: none
          options:
            - label: 不显示
              value: none
            - label: 仅文章列表
              value: list
            - label: 仅正文页
              value: article
            - label: 列表与正文
              value: all
        - $formkit: switch
          name: show_home_sidebar
          label: 首页资料侧栏
          help: 展示站点简介、社交账号、内容数量和栏目索引。
          value: true
        - $formkit: switch
          name: show_home_profile
          label: 首页显示站点资料
          help: 显示站点 Logo、副标题和社交账号。
          value: true
        - $formkit: switch
          name: show_home_categories
          label: 首页显示文章分类
          value: true
        - $formkit: switch
          name: show_home_tags
          label: 首页显示高频标签
          help: 在首页侧栏按文章数展示常用标签；完整标签仍在标签汇总页显示。
          value: true
        - $formkit: number
          name: home_tag_count
          label: 首页标签数量
          value: 10
          min: 6
          max: 16
          step: 1
        - $formkit: switch
          name: show_post_sidebar
          label: 正文侧栏
          help: 展示目录与正文辅助信息；移动端自动隐藏。
          value: true
        - $formkit: switch
          name: show_post_toc
          label: 正文侧栏显示目录
          value: true
        - $formkit: switch
          name: show_post_latest
          label: 正文侧栏显示最新文章
          value: true
        - $formkit: number
          name: post_sidebar_count
          label: 最新文章数量
          help: 正文目录下展示的最新文章数量，建议 3–8 篇。
          value: 5
          min: 3
          max: 8
          step: 1
        - $formkit: switch
          name: show_post_comments
          label: 侧栏显示当前文章最新评论
          help: 仅在当前文章存在公开评论时显示，不替代正文评论区。
          value: false
        - $formkit: number
          name: post_comment_count
          label: 侧栏评论数量
          value: 3
          min: 1
          max: 5
          step: 1
        - $formkit: switch
          name: show_post_license
          label: 正文底部显示作者声明
          help: 展示文章标题、原文地址、作者、发布日期和许可方式。
          value: true
        - $formkit: text
          name: license_name
          label: 内容许可名称
          help: 例如 All rights reserved 或 CC BY-NC-SA 4.0。
          value: All rights reserved
        - $formkit: url
          name: license_url
          label: 内容许可地址
          help: 可选；使用 Creative Commons 等公开许可时填写对应说明地址。
          value: ""
    - group: stats
      label: 站点统计
      formSchema:
        - $formkit: switch
          name: show_home_stats
          label: 首页显示站点统计
          help: 展示访问、点赞、评论、文章和分类等 Halo 原生累计数据。
          value: true
        - $formkit: switch
          name: show_footer_stats
          label: 页脚显示站点统计
          help: 在页脚显示文章、评论和访问量；适合保持为一行轻量信息。
          value: false
        - $formkit: date
          name: site_launch_date
          label: 建站日期
          help: 可选；填写后统计区域显示已运行天数。
          value: ""
    - group: compliance
      label: 备案信息
      formSchema:
        - $formkit: text
          name: icp_number
          label: ICP备案号
          help: 可选；留空时页脚不显示 ICP 备案信息。
          value: ""
        - $formkit: url
          name: icp_url
          label: ICP备案跳转链接
          help: 默认跳转至工信部备案管理系统。
          value: "https://beian.miit.gov.cn/"
        - $formkit: text
          name: public_security_number
          label: 公网安备号
          help: 可选；填写完整展示文案，例如“京公网安备 11000002000001号”。
          value: ""
        - $formkit: url
          name: public_security_url
          label: 公网安备跳转链接
          help: 可选；建议填写该备案记录在公安备案系统中的详情链接。
          value: ""
    - group: seo
      label: SEO
      formSchema:
        - $formkit: switch
          name: noindex_tags
          label: 暂不索引标签页
          help: 标签治理完成前建议开启；标签总览和详情页输出 noindex,follow。不会修改 sitemap。
          value: true
        - $formkit: switch
          name: noindex_archives
          label: 暂不索引归档页
          help: 归档页主要用于浏览时建议开启；文章和栏目页面不受影响。
          value: true
        - $formkit: text
          name: google_verification
          label: Google 站点验证码
          help: 只填写 google-site-verification 的 content 值，不要粘贴完整 meta 标签。
          value: ""
        - $formkit: text
          name: bing_verification
          label: Bing 站点验证码
          help: 只填写 msvalidate.01 的 content 值。
          value: ""
        - $formkit: text
          name: baidu_verification
          label: 百度站点验证码
          help: 只填写 baidu-site-verification 的 content 值；标签格式以百度后台当前提供为准。
          value: ""
        - $formkit: text
          name: organization_name
          label: 站点组织名称
          help: 用于 Organization / WebSite 结构化数据；留空则使用站点标题。
          value: ""
        - $formkit: attachment
          name: organization_logo
          label: 站点组织 Logo
          help: 建议使用清晰的正方形图片；留空则使用站点 Logo 或主题默认图标。
          accepts:
            - image/*
          value: ""
        - $formkit: url
          name: about_url
          label: 关于页面地址
          help: 可选，用于补充站点实体信息，例如 https://example.com/about。
          value: ""
    - group: analytics
      label: 访问分析
      formSchema:
        - $formkit: switch
          name: enabled
          label: 启用第三方访问分析
          help: 默认关闭；启用后仅加载已填写且格式有效的分析服务。
          value: false
        - $formkit: text
          name: ga4_id
          label: GA4 Measurement ID
          help: 格式为 G-XXXXXXXXXX。不要填写完整脚本代码。
          value: ""
          validation: matches:/^G-[A-Z0-9]+$/
        - $formkit: text
          name: clarity_id
          label: Microsoft Clarity Project ID
          help: 可选，只填写项目 ID；使用前请按所在地区完成隐私与 Cookie 告知。
          value: ""
          validation: matches:/^[A-Za-z0-9]+$/
        - $formkit: text
          name: baidu_analytics_id
          label: 百度统计站点 ID
          help: 可选，只填写 hm.js? 后的 32 位十六进制 ID。
          value: ""
          validation: matches:/^[a-fA-F0-9]{32}$/
    - group: integrations
      label: 集成
      formSchema:
        - $formkit: switch
          name: show_links
          label: 显示友情链接入口
          help: 需要 Halo 官方“链接管理”插件；主题适配其 /links 页面并控制首页、页脚入口。
          value: true
        - $formkit: switch
          name: show_links_in_footer
          label: 页脚显示友情链接入口
          value: true
    - group: monetization
      label: 广告与联盟
      formSchema:
        - $formkit: switch
          name: enabled
          label: 启用主题广告位
          help: 关闭后所有主题广告位不渲染；正文中手动添加的链接不受影响。
          value: false
        - $formkit: textarea
          name: disclosure_text
          label: 推广披露文案
          help: 仅在实际显示主题广告时出现，保持简短、真实。
          rows: 2
          value: ""
        - $formkit: array
          name: ads
          label: 广告位
          help: 静态文字或图片广告，可拖动排序，最多 8 个；不支持任意脚本以保护性能和安全。
          value: []
          max: 8
          addLabel: 添加广告
          emptyText: 暂未添加广告
          itemLabels:
            - type: text
              label: $value.name
          children:
            - $formkit: switch
              name: enabled
              label: 启用
              value: true
            - $formkit: select
              name: position
              label: 展示位置
              value: home_top
              options:
                - label: 首页文章区顶部
                  value: home_top
                - label: 首页右侧栏
                  value: home_sidebar
                - label: 正文开始前
                  value: post_before
                - label: 正文结束后
                  value: post_after
            - $formkit: text
              name: name
              label: 广告名称
              value: ""
              validation: required
            - $formkit: textarea
              name: description
              label: 简短说明
              rows: 2
              value: ""
            - $formkit: attachment
              name: image
              label: 图片（可选）
              accepts:
                - image/*
              value: ""
            - $formkit: url
              name: url
              label: 跳转地址
              help: 推广地址会自动添加 sponsored、nofollow 和安全属性。
              value: ""
              validation: required
