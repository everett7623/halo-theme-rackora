apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-rackora
  annotations:
    # 关联 Halo 应用市场条目，Console 可据此识别已安装的主题并提示更新
    # https://www.halo.run/store/apps/app-bflwdcgw
    "store.halo.run/app-id": "app-bflwdcgw"
spec:
  displayName: Rackora
  author:
    name: everettlabs
    website: https://everettlabs.dev/
  description: A minimal, content-first Halo theme for independent publishing, knowledge bases, and technical writing.
  logo: /themes/theme-rackora/assets/images/rackora-mark.svg
  homepage: https://github.com/everett7623/halo-theme-rackora#readme
  repo: https://github.com/everett7623/halo-theme-rackora
  issues: https://github.com/everett7623/halo-theme-rackora/issues
  settingName: "theme-rackora-setting"
  configMapName: "theme-rackora-configMap"
  customTemplates:
    page:
      - name: 关于页（About）
        description: 带 Logo、站点简介与社交链接的关于页
        file: page_about.html
    post:
      - name: 文档（Documentation）
        description: 目录常驻侧栏的文档式长文布局
        file: post_docs.html
  version: 0.9.9
  requires: ">=2.20.0"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/everett7623/halo-theme-rackora/blob/main/LICENSE"
