name: Release theme

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and theme version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Build and validate
        run: |
          pnpm build
          pnpm test
          pnpm test:budget

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTES_FILE="$(mktemp)"
          node scripts/extract-changelog.mjs "${VERSION}" > "${NOTES_FILE}"
          ASSET="dist/theme-rackora-${VERSION}.zip"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --title "Rackora v${VERSION}" --notes-file "${NOTES_FILE}"
            gh release upload "v${VERSION}" "${ASSET}" --clobber
          else
            gh release create "v${VERSION}" "${ASSET}" \
              --title "Rackora v${VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi
