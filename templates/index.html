<!doctype html>
<html
  lang="zh-CN"
  xmlns:th="http://www.thymeleaf.org"
  th:attr="data-color-scheme=${theme.config.appearance.color_scheme ?: 'auto'}"
  th:class="|color-scheme-${theme.config.appearance.color_scheme ?: 'auto'}|"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101714" media="(prefers-color-scheme: dark)" />
    
    <title th:text="${site.title}">首页</title>
  
    <script>
      (() => {
        try {
          const savedScheme = localStorage.getItem("rackora-color-scheme");
          if (savedScheme === "light" || savedScheme === "dark") {
            document.documentElement.dataset.colorScheme = savedScheme;
            document.documentElement.classList.remove(
              "color-scheme-auto",
              "color-scheme-light",
              "color-scheme-dark",
            );
            document.documentElement.classList.add(`color-scheme-${savedScheme}`);
          }
        } catch (_) {
          // Storage can be unavailable in privacy modes; the server setting remains authoritative.
        }
      })();
    </script>
    <script type="module" crossorigin src="/themes/theme-rackora/assets/main-COsQWlB8.js"></script>
    <link rel="stylesheet" crossorigin href="/themes/theme-rackora/assets/main-DxT_5I03.css">
  </head>
  <body th:style="|--rack-accent: ${theme.config.appearance.accent_color ?: '#08775b'}|">
    <a class="skip-link" href="#main-content">跳到正文</a>

    <header class="site-header site-header--compact">
      <div class="shell header-inner">
        <a class="brand" th:href="@{/}" aria-label="返回首页">
          <img
            class="brand-mark"
            width="34"
            height="34"
            th:src="${#strings.isEmpty(site.logo) ? #theme.assets('/images/rackora-mark.svg') : site.logo}"
            th:alt="${site.title}"
          />
          <span class="brand-copy">
            <strong th:text="${site.title}">Rackora</strong>
            <small
              th:if="${not #strings.isEmpty(site.subtitle)}"
              th:text="${site.subtitle}"
            ></small>
          </span>
        </a>

        <button
          class="icon-button nav-toggle"
          type="button"
          aria-label="打开导航"
          aria-controls="primary-nav"
          aria-expanded="false"
          data-nav-toggle
        >
          <i data-lucide="menu" aria-hidden="true"></i>
        </button>

        <nav
          id="primary-nav"
          class="site-nav"
          aria-label="主导航"
          th:with="menu = ${menuFinder.getPrimary()}"
          data-site-nav
        >
          <ul th:if="${menu != null and not #lists.isEmpty(menu.menuItems)}">
            <li th:each="item : ${menu.menuItems}">
              <a
                th:href="@{${item.status.href}}"
                th:text="${item.status.displayName}"
                th:target="${item.spec.target?.value}"
              ></a>
            </li>
          </ul>
          <ul class="fallback-nav" th:if="${menu == null or #lists.isEmpty(menu.menuItems)}">
            <li><a th:href="@{/}">首页</a></li>
            <li><a th:href="@{${site.routes.archivesUri}}">归档</a></li>
            <li><a th:href="@{${site.routes.categoriesUri}}">栏目</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <button
            class="icon-button"
            type="button"
            title="搜索"
            aria-label="搜索"
            th:if="${pluginFinder.available('PluginSearchWidget')}"
            onclick="SearchWidget.open()"
          >
            <i data-lucide="search" aria-hidden="true"></i>
          </button>
          <button
            class="icon-button"
            type="button"
            title="切换配色"
            aria-label="切换配色"
            data-theme-toggle
          >
            <i data-lucide="moon" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="site-main">
      <div class="shell">
        
  

  <figure class="home-banner" th:if="${not #strings.isEmpty(theme.config.appearance.banner_image)}">
    <img
      th:src="${theme.config.appearance.banner_image}"
      th:alt="|${site.title} 横幅|"
      width="1600"
      height="480"
      decoding="async"
      fetchpriority="high"
    />
  </figure>

  <div
    class="home-grid"
    th:classappend="${theme.config.content.show_home_sidebar} ? '' : ' home-grid--single'"
  >
    <section class="home-heading" aria-labelledby="home-title">
      <h1 id="home-title" th:text="${site.title}">站点标题</h1>
      <p th:if="${not #strings.isEmpty(site.subtitle)}" th:text="${site.subtitle}"></p>
      <div class="home-heading__meta">
        <span th:text="|${posts.total} 篇内容|">0 篇内容</span>
        <span>价格与库存按核验时间为准</span>
      </div>
    </section>

    <section class="content-section" aria-labelledby="latest-title">
      <header class="section-heading">
        <h2 id="latest-title">最新文章</h2>
        <a class="text-link" th:href="@{${site.routes.archivesUri}}">查看归档</a>
      </header>

      <ul class="post-list post-list--cards" th:if="${not #lists.isEmpty(posts.items)}">
        <li
  class="post-entry"
  th:each="post : ${posts.items}"
  th:classappend="${post.spec.pinned} ? ' is-pinned'"
>
  <a
    class="post-cover"
    th:if="${(theme.config.content.image_mode == 'list' or theme.config.content.image_mode == 'all') and not #strings.isEmpty(post.spec.cover)}"
    th:href="@{${post.status.permalink}}"
    tabindex="-1"
    aria-hidden="true"
  >
    <img
      th:src="${post.spec.cover}"
      th:alt="${post.spec.title}"
      loading="lazy"
      decoding="async"
      width="320"
      height="180"
    />
  </a>
  <div class="post-entry__body">
    <div class="post-entry__eyebrow">
      <span class="status-label" th:if="${post.spec.pinned}">置顶</span>
      <a
        class="category-link"
        th:if="${not #lists.isEmpty(post.categories)}"
        th:href="@{${post.categories[0].status.permalink}}"
        th:text="${post.categories[0].spec.displayName}"
      ></a>
      <time
        th:datetime="${post.spec.publishTime}"
        th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"
      ></time>
    </div>
    <h2 class="post-entry__title">
      <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}"></a>
    </h2>
    <p class="post-entry__excerpt" th:text="${post.status.excerpt}"></p>
    <div class="post-entry__meta">
      <span th:text="|${post.stats.visit} 阅读|">0 阅读</span>
      <span th:text="|${post.stats.comment} 评论|">0 评论</span>
      <span
        th:if="${post.status.lastModifyTime != null}"
        th:text="|更新 ${#temporals.format(post.status.lastModifyTime, 'MM-dd')}|"
      ></span>
    </div>
  </div>
</li>

      </ul>
      <div class="empty-state" th:if="${#lists.isEmpty(posts.items)}">
        <h2>暂时没有公开文章</h2>
        <p>发布第一篇内容后，它会显示在这里。</p>
      </div>

      <nav class="pagination" aria-label="分页" th:if="${posts.hasPrevious() || posts.hasNext()}">
  <a class="pagination__link" th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}">
    <i data-lucide="arrow-left" aria-hidden="true"></i>
    <span>上一页</span>
  </a>
  <span class="pagination__status" th:text="|${posts.page} / ${posts.totalPages}|">1 / 1</span>
  <a class="pagination__link" th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}">
    <span>下一页</span>
    <i data-lucide="arrow-right" aria-hidden="true"></i>
  </a>
</nav>

    </section>

    <aside
      class="home-sidebar"
      aria-label="站点信息"
      th:if="${theme.config.content.show_home_sidebar}"
      th:with="homeCategories = ${categoryFinder.listAll()}"
    >
      <section class="profile-panel">
        <img
          class="profile-panel__mark"
          width="64"
          height="64"
          th:src="${#strings.isEmpty(site.logo) ? #theme.assets('/images/rackora-mark.svg') : site.logo}"
          th:alt="${site.title}"
        />
        <div>
          <h2 th:text="${site.title}">Rackora</h2>
          <p th:text="${site.subtitle ?: '独立测试、透明披露、持续更新。'}"></p>
        </div>
        <nav
          class="profile-socials"
          aria-label="社交账号"
          th:if="${not #lists.isEmpty(theme.config.basic.socials)}"
        >
          <a
            th:each="social : ${theme.config.basic.socials}"
            th:if="${not #strings.isEmpty(social.name) and not #strings.isEmpty(social.url)}"
            th:href="@{${social.url}}"
            th:title="${social.name}"
            th:attr="aria-label=${social.name}"
            target="_blank"
            rel="me noopener noreferrer"
          >
            <i th:attr="data-lucide=${social.icon ?: 'globe'}" aria-hidden="true"></i>
          </a>
        </nav>
        <dl class="profile-stats">
          <div>
            <dt>文章</dt>
            <dd th:text="${posts.total}">0</dd>
          </div>
          <div>
            <dt>栏目</dt>
            <dd th:text="${#lists.size(homeCategories)}">0</dd>
          </div>
        </dl>
      </section>

      <section class="sidebar-panel" th:if="${not #lists.isEmpty(homeCategories)}">
        <header>
          <h2>内容栏目</h2>
          <a th:href="@{${site.routes.categoriesUri}}">全部</a>
        </header>
        <ul>
          <li th:each="category : ${homeCategories}">
            <a th:href="@{${category.status.permalink}}">
              <span th:text="${category.spec.displayName}">栏目</span>
              <small th:text="${category.postCount}">0</small>
            </a>
          </li>
        </ul>
      </section>

      <nav class="sidebar-shortcuts" aria-label="内容索引">
        <a th:href="@{${site.routes.archivesUri}}">文章归档</a>
        <a th:href="@{${site.routes.tagsUri}}">标签索引</a>
      </nav>
    </aside>
  </div>

      </div>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <div>
          <strong th:text="${site.title}">Rackora</strong>
          <p th:text="${site.subtitle ?: '独立测试、透明披露、持续更新。'}"></p>
        </div>
        <nav aria-label="页脚导航">
          <a th:href="@{${site.routes.archivesUri}}">归档</a>
          <a th:href="@{${site.routes.categoriesUri}}">栏目</a>
          <a th:href="@{${site.routes.tagsUri}}">标签</a>
        </nav>
        <small>
          <span>Powered by Halo</span>
          <span aria-hidden="true"> · </span>
          <a href="https://github.com/everett7623/halo-theme-rackora" rel="noopener" target="_blank"
            >Rackora</a
          >
        </small>
      </div>
      <halo:footer />
    </footer>

    <button
      class="back-to-top"
      type="button"
      title="返回顶部"
      aria-label="返回顶部"
      data-back-to-top
    >
      <i data-lucide="chevron-up" aria-hidden="true"></i>
    </button>
  </body>
</html>
